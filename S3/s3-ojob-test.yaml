ojob:
  async       : false
  opacks      :
  - oJob-common
  - openaf: 20220822
  catch       : global.s3TestJobFailed = true; printErrnl("[" + job.name + "] "); if (isDef(exception.javaException)) exception.javaException.printStackTrace(); else printErr(exception)
  logToConsole: true   # to change when finished
        
include:
- tests/config.yaml
- s3.yaml
- oJobTest.yaml

jobs:
- name: Results
  from: oJob Test Results
  args:
    quiet: true
  exec: |
    tprint("Tests PASSED: {{pass}}/{{count}}", args.results);
    tprint("Tests FAILED: {{fail}}/{{count}}", args.results);
    if (args.results.count != 9 || args.results.fail > 0 || global.s3TestJobFailed) exit(1);

- name : Set args
  from: S3 Test config
  exec: |
    args.url = global.s3TestConfig.url;
    args.accessKey = global.s3TestConfig.accessKey;
    args.secret = global.s3TestConfig.secretKey;
    args.region = global.s3TestConfig.region;
    global.s3TestBucket = _$(global.s3TestBucket).isString().default(global.s3TestConfig.testBucket + "-" + now());
    args.bucket = global.s3TestBucket;

# -------------------
- name : Count buckets
  from : Set args
  to   : 
  - S3 List Buckets
  - ojob output
  args:
    # ojob output args
    __key        : args
    __path       : length(list)

# -----------------------
- name: Test count buckets
  from: Set args
  to  : oJob Test
  args:
    func: |
      loadLib("s3.js");
      var s3 = new S3(global.s3TestConfig.url, global.s3TestConfig.accessKey, global.s3TestConfig.secretKey, global.s3TestConfig.region);
      try {
        ow.test.assert(isArray(s3.listBuckets()), true, "Problem listing buckets through oJob.");
      } finally {
        s3.close();
      }

# --------------------
- name : Create bucket
  from : Set args
  to   : S3 Make bucket

# ------------------------
- name: Test bucket exists
  from: Set args
  to  : oJob Test
  args:
    func: |
      loadLib("s3.js");
      var bucket = _$(global.s3TestBucket).isString().default(global.s3TestConfig.testBucket);
      var s3 = new S3(global.s3TestConfig.url, global.s3TestConfig.accessKey, global.s3TestConfig.secretKey, global.s3TestConfig.region);
      try {
        ow.test.assert(s3.bucketExists(bucket), true, "Problem creating bucket through oJob.");
      } finally {
        s3.close();
      }

# -----------------
- name : Put object
  from : Set args
  to   : S3 Put object
  args :
    objectName  : s3-ojob-test.yaml
    localPath   : s3-ojob-test.yaml

# --------------------------------
- name: Test uploaded object exists
  from: Set args
  to  : oJob Test
  args:
    func: |
      loadLib("s3.js");
      var bucket = _$(global.s3TestBucket).isString().default(global.s3TestConfig.testBucket);
      var s3 = new S3(global.s3TestConfig.url, global.s3TestConfig.accessKey, global.s3TestConfig.secretKey, global.s3TestConfig.region);
      try {
        ow.test.assert(s3.objectExists(bucket, "s3-ojob-test.yaml"), true, "Problem uploading object through oJob.");
      } finally {
        s3.close();
      }

# ------------------
- name : Copy object
  from : Set args
  to   : S3 Copy object
  args :
    sourceObject: s3-ojob-test.yaml
    targetObject: s3-ojob-test2.yaml
  exec: |
    args.sourceBucket = args.bucket;
    args.targetBucket = args.bucket;

# ------------------------------
- name: Test copied object exists
  from: Set args
  to  : oJob Test
  args:
    func: |
      loadLib("s3.js");
      var bucket = _$(global.s3TestBucket).isString().default(global.s3TestConfig.testBucket);
      var s3 = new S3(global.s3TestConfig.url, global.s3TestConfig.accessKey, global.s3TestConfig.secretKey, global.s3TestConfig.region);
      try {
        ow.test.assert(s3.objectExists(bucket, "s3-ojob-test.yaml"), true, "Problem keeping source object after oJob copy.");
        ow.test.assert(s3.objectExists(bucket, "s3-ojob-test2.yaml"), true, "Problem copying object through oJob.");
      } finally {
        s3.close();
      }

# -------------------
- name : List objects
  from : Set args
  to   : 
  - S3 List
  - ojob output
  args :
    # S3 List args
    needFull     : true
    needRecursive: true
    # ojob output args
    __key        : args
    __path       : list

# ------------------------
- name: Test listed objects
  from: Set args
  to  : oJob Test
  args:
    func: |
      loadLib("s3.js");
      var bucket = _$(global.s3TestBucket).isString().default(global.s3TestConfig.testBucket);
      var s3 = new S3(global.s3TestConfig.url, global.s3TestConfig.accessKey, global.s3TestConfig.secretKey, global.s3TestConfig.region);
      try {
        var lst = s3.listObjects(bucket, "", true, true);
        ow.test.assert($from(lst).equals("filename", "s3-ojob-test.yaml").count(), 1, "Problem listing uploaded object through oJob.");
        ow.test.assert($from(lst).equals("filename", "s3-ojob-test2.yaml").count(), 1, "Problem listing copied object through oJob.");
      } finally {
        s3.close();
      }

# --------------------
- name : Remove object
  from : Set args
  to   : S3 Remove object
  args :
  - objectName  : s3-ojob-test.yaml
  - objectName  : s3-ojob-test2.yaml

# --------------------------
- name: Test objects removed
  from: Set args
  to  : oJob Test
  args:
    func: |
      loadLib("s3.js");
      var bucket = _$(global.s3TestBucket).isString().default(global.s3TestConfig.testBucket);
      var s3 = new S3(global.s3TestConfig.url, global.s3TestConfig.accessKey, global.s3TestConfig.secretKey, global.s3TestConfig.region);
      try {
        ow.test.assert(s3.objectExists(bucket, "s3-ojob-test.yaml"), false, "Problem removing first object through oJob.");
        ow.test.assert(s3.objectExists(bucket, "s3-ojob-test2.yaml"), false, "Problem removing second object through oJob.");
      } finally {
        s3.close();
      }

# -------------------------
- name : Sync squash remote
  from : Set args
  to   : 
  - S3 Sync folder
  - ojob output
  args :
    # s3 sync folder args
    prefix   : ""
    localPath: tests/fixtures
    squash   : remote
    execute  : true
    # ojob output args
    __key        : args
    __path       : actions

# -----------------------
- name: Test sync actions
  from: Set args
  to  : oJob Test
  args:
    func: |
      loadLib("s3.js");
      var bucket = _$(global.s3TestBucket).isString().default(global.s3TestConfig.testBucket);
      var s3 = new S3(global.s3TestConfig.url, global.s3TestConfig.accessKey, global.s3TestConfig.secretKey, global.s3TestConfig.region);
      try {
        ow.test.assert(s3.listObjects(bucket, "", __, true).length, 1, "Problem syncing only fixture files through oJob.");
        var stream = s3.getObjectStream(bucket, "sync.txt");
        try {
          ow.test.assert(af.fromInputStream2String(stream), io.readFileString("tests/fixtures/sync.txt"), "Problem syncing fixture contents through oJob.");
        } finally {
          stream.close();
        }
      } finally {
        s3.close();
      }

# -------------------------
- name : Remove all objects
  from : Set args
  to   : S3 Remove objects by prefix
  args :
    prefix: ""
    #limitPerCall: 1000

# ----------------------
- name: Test bucket empty
  from: Set args
  to  : oJob Test
  args:
    func: |
      loadLib("s3.js");
      var bucket = _$(global.s3TestBucket).isString().default(global.s3TestConfig.testBucket);
      var s3 = new S3(global.s3TestConfig.url, global.s3TestConfig.accessKey, global.s3TestConfig.secretKey, global.s3TestConfig.region);
      try {
        ow.test.assert(s3.listObjects(bucket, "", __, true).length, 0, "Problem removing objects by prefix through oJob.");
      } finally {
        s3.close();
      }

# ---------------------
- name : Destroy bucket
  from : Set args
  to   : S3 Remove bucket

# ------------------------
- name: Test bucket removed
  from: Set args
  to  : oJob Test
  args:
    func: |
      loadLib("s3.js");
      var bucket = _$(global.s3TestBucket).isString().default(global.s3TestConfig.testBucket);
      var s3 = new S3(global.s3TestConfig.url, global.s3TestConfig.accessKey, global.s3TestConfig.secretKey, global.s3TestConfig.region);
      try {
        ow.test.assert(s3.bucketExists(bucket), false, "Problem removing bucket through oJob.");
      } finally {
        s3.close();
      }
