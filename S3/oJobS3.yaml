include:
- oJobHTTPd.yaml
- oJobBrowse.yaml

code:
  s3-browse-view.js: |
    var support = require("ojob-browse-contract.js")

    exports.url = (route, relative) => String(route).replace(/\/+$/, "") + "/" +
      relative.replace(/^\/+/, "").split("/").map(global.__ojobHttpFileLink).join("/")

    exports.prefix = path => String(path || "").replace(/^\/+|\/+$/g, "").replace(/(.+)$/, "$1/")

    exports.validate = (relative, prefix, restrict) => {
      var patterns = (isString(restrict) ? [restrict] : restrict || []).map(p => new RegExp(p))
      var parts = relative.replace(/\/+$/, "").split("/")
      if (parts.some(p => p == "." || p == "..") || /[\\\x00]/.test(relative) || relative.startsWith("/") ||
          parts.some((part, i) => {
            var parent = parts.slice(0, i + 1).join("/")
            return patterns.some(p => p.test(parent) || p.test(prefix + parent) || p.test(prefix + parent + "/"))
          })) support.error(403, "Forbidden")
    }

    exports.read = (s3, bucket, key, request, options, renderMarkdown) => {
      var params = request.params || {}
      var allowRaw = options.noRaw !== true
      var raw = allowRaw && params.raw == "true"
      var name = key.substring(key.lastIndexOf("/") + 1)
      if (renderMarkdown && !options._api && !request._browsePreview && !request._browseInline &&
          params.action != "preview" && !raw && /\.md$/i.test(name)) {
        var stream = s3.getObjectStream(bucket, key)
        try { return { data: af.fromInputStream2String(stream, "UTF-8"), type: "md" } }
        finally { stream.close() }
      }

      var headers = { "X-Content-Type-Options": "nosniff" }
      var preview = options.preview || {}
      var web = !options._api && params.action != "preview" && options.web && options.web.enabled === true && !raw
      var formats = Object.assign({}, support.defaults, { log: "text", html: "html", htm: "html" })
      var type = !web && !options._api && !raw && support.format(name, preview, formats)
      if (!type) {
        if (!web) headers["Content-Disposition"] = 'attachment; filename="' +
          name.replace(/[^a-zA-Z0-9_. -]/g, "_") + "\"; filename*=UTF-8''" + global.__ojobHttpFileLink(name)
        return { stream: s3.getObjectStream(bucket, key), streamHeaders: headers,
          streamType: web ? ow.server.httpd.getMimeType(name) : "application/octet-stream" }
      }

      if (type == "json" && (params.view == "json" || params.view == "json-data" ||
          (params.parse != "false" && params.view != "source"))) {
        return support.jsonPreview(request, options, () => s3.getObjectStream(bucket, key), allowRaw)
      }

      var imageType = isFunction(support.imageType) && support.imageType(type)
      if (imageType) return support.imagePreview(s3.getObjectStream(bucket, key), imageType)
      if (type == "html" && params.view != "source") return support.htmlPreview(s3.getObjectStream(bucket, key))

      // Keep untrusted source out of HTML and script contexts.
      var limit = support.previewLimit(preview.maxBytes)
      var object = support.readPreview(s3.getObjectStream(bucket, key, 0, limit + 1), "text", limit)
      var markup
      if (!object.truncated && (type == "markdown" || type == "md")) markup = support.safeMarkdown(object.data)
      else {
        var language = object.truncated ? "text" : type
        markup = '<div><pre><code class="language-' + language + '">' +
          ow.format.escapeHTML(object.data).replace(/\r?\n/g, "&#10;") + '</code></pre></div>'
      }
      if (type == "json") markup = '<p><a href="' + support.jsonViewURL(request, "json") + '">Render</a></p>' +
        "\n\n" + markup
      return { data: markup, type: "raw", browseDetail: true, jsonSource: type == "json", truncated: object.truncated }
    }

    exports.previewBackArrow = support.previewBackArrow
 
jobs:
# ---------------------
- name : HTTP S3 Browse
  deps :
  - HTTP Start Server
  to   : HTTP Service
  typeArgs:
    noLog: false 
    shortcut:
      name  : httpdS3Browse
      keyArg: port
      args  : 
        url      : url
        bucket   : bucket
        accessKey: accessKey
        secret   : secret
        region   : region
        uri      : uri
        path     : path
        browse   : browse
        default  : default
        logo     : logo
        restrict : restrict
        incURI   : incURI
        cache    : cache
        sortTab  : sortTab
        options  : options
  help : 
   text   : Provides a HTTP S3 objects browse definition. 
   expects:
   - name: port
     desc: (Number) The port where the server was made available (default is 8091)
   - name: uri
     desc: (String) The URI where the HTTP S3 objects Browse will be available.
   - name: path
     desc: (String) The canonical path (the prefix) to the folder that contains the file to be browsed.
   - name: browse
     desc: (String) If "false" no browsing interface is included.
   - name: default
     desc: (String) The markdown or html filename to consider default (e.g. index.md)
   - name: logo
     desc: (String) The logo to include on the top right corner
   - name: restrict
     desc: (String/Array) A regular expression (or list) that if matched won't be listed
   - name: incURI
     desc: (Boolean) If true includes the URI in the breadcrumbs
   - name: cache
     desc: (Number) The cache time in ms for the S3 object lists
   - name: sortTab
     desc: (Boolean) If true includes the table sorting script (OpenAF >= 20250402)
  check:
    in:
      url      : isString
      bucket   : isString
      accessKey: isString.default(__)
      secret   : isString.default(__)
      region   : isString.default(__)
      port     : toNumber.isNumber.default(8091)
      uri      : isString.default("/")
      path     : isString.default("")
      browse   : toBoolean.isBoolean.default(true)
      default  : isString.default(__)
      logo     : isString.default("/fonts/openaf_small.png")
      restrict : default(__)
      incURI   : toBoolean.isBoolean.default(false)
      cache    : toNumber.isNumber.default(__)
      sortTab  : toBoolean.isBoolean.default(false)
  args : 
   execURI   : | #js
      var shouldBrowse = global.__MHTTPD[String(port) + uri].BROWSE
      var path         = global.__MHTTPD[String(port) + uri].PATH
      var tmplb        = global.__MHTTPD[String(port) + uri].TMPLB
      var tmplh        = global.__MHTTPD[String(port) + uri].TMPLH
      var fdefault     = global.__MHTTPD[String(port) + uri].DEFAULT
      var s3           = global.__MHTTPD[String(port) + uri].S3
      var bucket       = global.__MHTTPD[String(port) + uri].BUCKET
      var restrict     = global.__MHTTPD[String(port) + uri].RESTRICT
      var options      = global.__MHTTPD[String(port) + uri].OPTIONS
      var cache        = global.__MHTTPD[String(port) + uri].CACHE
      var sortTab      = global.__MHTTPD[String(port) + uri].SORTTAB

      var content = ""
      var view = require("s3-browse-view.js")
      var furi = global.__ojobHttpRelativePath(request.uri, uri)
      try { view.validate(furi, path, restrict) } catch (e) {
        if (e.httpStatus == 403) return server.reply("Forbidden", "text/plain", 403)
        throw e
      }
      var puri = "/" + furi

      var serveObject = relative => {
        view.validate(relative, path, restrict)
        var objectRequest = Object.assign({}, request, { uri: uri.replace(/\/+$/, "") + "/" + relative })
        var result = view.read(s3, bucket, path + relative, objectRequest, Object.assign({}, options, { port: port, browse: shouldBrowse }), options.browse === true)
        if (result.stream) return server.replyStream(result.stream, result.streamType, 200, result.streamHeaders)
        if (result.type == "md") return server.replyOKHTML(ow.template.parseMD2HTML(result.data, true))
        var download = result.jsonViewer || options.noRaw === true ? "" :
          '<a href="' + ow.format.escapeHTML(view.url(uri, relative)) + '?raw=true" download>Download raw</a>'
        var header = view.previewBackArrow + "\n\n" + tmplh({ puri: relative })
        return server.replyOKHTML(ow.template.parseMD2HTML(header + "\n\n" + download + "\n\n" + result.data, true))
      }

      if (!puri.endsWith("/")) puri += "/"

      var lst, origLst
      try { 
         // List and restrict
         if (isDef(cache)) {
            lst = $cache(cache).get({ puri: (puri == "/" ? "" : puri).replace(/^\//, "") })
         } else {
            lst = s3.listObjects(bucket, path + (puri == "/" ? "" : puri).replace(/^\//, ""))
            if ((puri == "/" ? "" : puri).replace(/^\//, "").length > 1) lst = lst.filter(r => r.filename != (puri == "/" ? "" : puri).replace(/^\//, ""))
         }

         origLst = lst
         if (isDef(restrict)) {
            if (isString(restrict)) restrict = [ restrict ]
            lst = lst.filter(f => restrict.reduce((aP, aC) => (aP && !(new RegExp(aC)).test(f.filename)), true))
         }

         // If not listed check if puri is restricted
         if (lst.length == 0 && isDef(restrict) && origLst.length != lst.length) {
            if (puri != "/" && puri != "") {
              return server.reply(ow.template.parseMD2HTML("## Restricted access\n\nYou do not have access to this folder.\n", true))
            }
         }
      } catch(e) {
         logErr(e)
         return server.replyOKHTML(ow.template.parseMD2HTML(tmplh({ puri : (puri == "" ? "/" : puri) }) + "\n" + "\n*no content available*\n", true))
      }

      try {
        if (origLst.length > 0) {
          var _defaultKey = path + (puri == "/" ? "" : puri).replace(/^\//, "") + String(fdefault)
          if (isDef(fdefault) && $from(lst).equals("filepath", _defaultKey).any()) {
              if (!String(request.uri).endsWith("/")) return ow.server.httpd.replyRedirect(server, view.url(uri, puri), {})
              return serveObject(_defaultKey.substring(path.length))
          } else {
              if (shouldBrowse) { 
                content += tmplh({ puri: (puri == "" ? "/" : puri) })
                content += "|   | Filename | Last modified | Size | Size in bytes |\n"
                content += "|---|----------|:--------------|-----:|--------------:|\n"
                if (puri != "/" && puri != "") 
                  content += "| <span style=\"color: #a0a0a0;\">&#8598;</span> | __[..](<" + view.url(uri, puri.replace(/[^\/]+\/$/, "")) + ">)__ | | |\n"

                var theList = $from(lst).sort("-isDirectory", "filename").notEquals("filepath", "/").select(f => {
                  if (f.filename.endsWith("/")) f.filename = f.filename.substr(0, f.filename.length-1)
                  return merge(f, {
                    fLastModified: isDef(f.lastModified) ? ow.format.fromDate(new Date(f.lastModified), 'yyyy-MM-dd HH:mm:ss') : "",
                    fSize        : ow.format.toBytesAbbreviation(f.size),
                    puri         : puri,
                    uri          : uri,
                    filename     : f.filename.substring(f.filename.lastIndexOf("/") + 1)
                  })
                })
                content += tmplb(theList)
              }
          }
        } else {
          return serveObject(furi)
        }
      } catch(eg) {
        if (eg.httpStatus == 403) return server.reply("Forbidden", "text/plain", 403)
        logErr(String(eg))
        return server.replyOKHTML(ow.template.parseMD2HTML(tmplh({ puri : (puri == "" ? "/" : puri) }) + "\n" + "\n*no content available*\n", true))
      }

      if (sortTab) content += "<script src=\"/js/mdtablesort.js\"></script>\n"

      if (shouldBrowse)
         return server.replyOKHTML(ow.template.parseMD2HTML(content, true))
      else
         return server.replyOKHTML(ow.template.parseMD2HTML(tmplh({ puri : (puri == "" ? "/" : puri) }) + "\n" + "\n*no content available*\n", true))
     
  exec : | #js
      ow.loadTemplate(); ow.loadFormat()
      ow.template.addHelper("encodeURI", encodeURI)
      
      loadLib("s3.js")

      args.uri  = _$(args.uri).isString().default("/")
      args.path = _$(args.path).isString().default("")
      var view = require("s3-browse-view.js")
      args.path = view.prefix(args.path)

      ow.template.addHelper("escapeMDTable", str => str.replace(/\|/g, "\\|"))
      ow.template.addHelper("s3-browse-url", (uri, path, name) => view.url(uri, path + name))
      ow.template.addHelper("s3-browse-label", global.__ojobHttpEscapeText)
      ow.template.addHelper("s3-buildBreadcrumbs", (path, uri, incURI) => {
        var escape = global.__ojobHttpEscapeText
        var parts = path.replace(/^\/+|\/+$/g, "").split("/").filter(Boolean)
        var html = incURI ? '<a href="/">/</a> ' : ""
        html += '<a href="' + escape(view.url(uri, "")) + '">' + (incURI ? escape(uri.replace(/^\/|\/$/g, "")) : "/") + '</a>'
        parts.forEach((part, index) => {
          var label = escape(part)
          html += ' / ' + (index == parts.length - 1 ? '<span>' + label + '</span>' :
            '<a href="' + escape(view.url(uri, parts.slice(0, index + 1).join("/") + "/")) + '">' + label + '</a>')
        })
        return html
      })

      args.logo = _$(args.logo, "logo").isString().default("/fonts/openaf_small.png")

      var temph = _$(args.templateHead).isString().default("## {{{s3-buildBreadcrumbs puri '" + args.uri + "' " + args.incURI + "}}}<img style=\"padding-left: 1em;\" align=\"right\" src=\"" + args.logo + "\">\n")
      var noRaw = args.options && args.options.noRaw === true
      var rawArrow = noRaw ? "" : '<a href="{{s3-browse-url uri puri filename}}?raw=true" download>&darr;</a>'
      var templ = _$(args.template).isString().default('{{#each this}}| {{#if isDirectory}}&#8600;{{else}}' + rawArrow + '{{/if}} | <a href="{{s3-browse-url uri puri filename}}{{#if isDirectory}}/{{/if}}">{{{s3-browse-label filename}}}</a> | {{fLastModified}} | {{fSize}} | {{size}} |\n{{/each}}')

      var _cache, s3
      var s3 = new S3(args.url, args.accessKey, args.secret, args.region)
      if (isUnDef(args.cache)) args.cache = 5000
      if (args.cache > 0) {
        _cache = "__oJobS3_" + genUUID()
        log("Creating cache " + _cache + "...")
        $cache(_cache)
        .ttl(args.cache)
        .fn(k => {
          log("  cache get " + af.toSLON(k)) 
          var _r = s3.listObjects(args.bucket, args.path + k.puri)
          if (k.puri.length > 1) _r = _r.filter(r => r.filename != k.puri)
          return _r
        })
        .create()
        // Warm the root cache at startup. A failed load can be retried on the first request.
        if (args.browse !== false) {
          try {
            $cache(_cache).get({ puri: "" })
          } catch (e) {
            logWarn("Could not warm the browse root cache")
          }
        }
      }

      global.__MHTTPD = _$(global.__MHTTPD).isMap().default({})
      global.__MHTTPD[String(args.port) + args.uri] = {
        BROWSE  : args.browse,
        PATH    : String(args.path),
        TMPLB   : ow.template.execCompiled(ow.template.compile(templ)),
        TMPLH   : ow.template.execCompiled(ow.template.compile(temph)),
        INCURI  : args.incURI,
        URI     : args.uri,
        DEFAULT : args.default,
        S3      : s3,
        BUCKET  : args.bucket,
        RESTRICT: args.restrict,
        CACHE   : _cache,
        SORTTAB : args.sortTab,
        OPTIONS : args.options || {}
      }

# -----------------------
- name    : HTTP Browse - s3
  to      : HTTP Browse generic
  typeArgs: 
    noLog   : false 
    shortcut: &httpBrowseS3TypeArgs
      name  : S3Browse
      keyArg: port
      args  : &httpBrowseS3Args
        url      : url
        bucket   : bucket
        accessKey: accessKey
        secret   : secret
        region   : region
        uri      : uri
        path     : path
        browse   : browse
        default  : default
        logo     : logo
        restrict : restrict
        incURI   : incURI
        cache    : cache
        sortTab  : sortTab
        options  : options
        operationsBrowseUris: operationsBrowseUris
  check:
    in:
      url      : isString
      bucket   : isString
      accessKey: isString.default(__)
      secret   : isString.default(__)
      region   : isString.default(__)
      port     : toNumber.isNumber.default(8091)
      uri      : isString.default("/")
      path     : isString.default("")
      browse   : toBoolean.isBoolean.default(true)
      default  : isString.default(__)
      logo     : isString.default("/fonts/openaf_small.png")
      restrict : default(__)
      incURI   : toBoolean.isBoolean.default(false)
      cache    : toNumber.isNumber.default(__)
      sortTab  : toBoolean.isBoolean.default(false)
      options  : isMap.default({})
  exec    : &httpBrowseS3Exec | #js
    var view = require("s3-browse-view.js")
    var renderMarkdown = args.options.browse === true
    args.path = view.prefix(args.path)
    var support, provider, enhanced = args.options && (args.options.query && args.options.query.enabled || args.options.preview || args.options.operations && args.options.operations.enabled)
    if (enhanced) {
      try { support = require("ojob-browse-contract.js") } catch(e) { throw new Error("Enhanced browsing requires updated oJob-common (browse contract 1)") }
      support.check(args.options, support.capabilities)
      provider = support.provider(args.options)
    }
    if (isUnDef(args.cache)) args.cache = 5000
    var cacheNamespace = "browse-" + genUUID() + "-"
    var browseCache = name => provider ? provider.cache(name) : $cache(cacheNamespace + name)

    args.options = merge(args.options, {
      showURI: args.incURI,
      sortTab: args.sortTab,
      logo   : args.logo,
      browse : args.browse,
      default: args.default
    })

    load("s3.js")
    if (enhanced && args.options.query && args.options.query.enabled && !isFunction(S3.prototype.walkObjects)) throw new Error("Enhanced S3 queries require S3.walkObjects; update the S3 oPack")
    var s3 = new S3(args.url, args.accessKey, args.secret, args.region)

    // Use the same prefix for the startup load and the first listing request.
    var listingPrefix = (root, path) => (String(root || "") + path).replace(/\/?$/, "/").replace(/^\//, "")

    // Share a bounded prefix walk across search terms and publish immutable batches.
    var scans = new Map(), scanLock = new java.lang.Object()
    var scanSlots = new java.util.concurrent.Semaphore(3)
    var scanKey = (prefix, recursive) => JSON.stringify([prefix, recursive])
    var searchSnapshot = (prefix, query, start, recursive) => {
      var key = scanKey(prefix, recursive)
      var next
      var snapshot = syncFn(() => {
        scans.forEach((state, key) => {
          if (!state.refreshing && now() >= state.expires) scans.delete(key)
        })
        var state = scans.get(key)
        if (start && state && state.failed) {
          scans.delete(key)
          state = undefined
        }
        if (!state && start && scans.size < 16 && scanSlots.tryAcquire()) {
          state = { prefix:prefix, batches: [], scanned: 0, refreshing: true, complete: false }
          scans.set(key, state)
          next = state
        }
        if (!state) return { rows: [], info: { scanned: 0, complete: false, ready: false } }
        return { batches: state.batches.slice(), info: {
          scanned: state.scanned, complete: state.complete, refreshing: state.refreshing,
          timedOut: state.timedOut, failed: state.failed, ready: true
        } }
      }, scanLock)
      if (next) {
        var finish = info => {
          syncFn(() => Object.assign(next, info, { refreshing: false, expires: now() + (args.cache > 0 ? args.cache : 30000) }), scanLock)
          scanSlots.release()
        }
        try {
          $doV(() => {
            var batch = []
            var publish = () => {
              if (!batch.length) return
              syncFn(() => {
                next.batches.push(batch)
                next.updatedAt = now()
                next.scanned += batch.length
              }, scanLock)
              batch = []
            }
            try {
              var info = s3.walkObjects(args.bucket, prefix, row => {
                batch.push(row)
                // Expose the first result immediately and amortize subsequent updates.
                if (next.scanned == 0 || batch.length >= 100) publish()
                return syncFn(() => scans.get(key) === next, scanLock)
              }, query, recursive)
              publish()
              finish(info)
            } catch (e) {
              publish()
              finish({ failed: true })
              logWarn("S3 browse search failed: " + e)
            }
          })
        } catch (e) { finish({ failed: true }) }
      }
      if (snapshot.batches) snapshot.rows = [].concat.apply([], snapshot.batches)
      return snapshot
    }

    args.fns = {
      validate: (request, options) => {
        view.validate(global.__ojobHttpRelativePath(request.uri, options.parentURI), String(options.parentPath || ""), args.restrict)
      },
      getList: (request, options) => {
        args.fns.validate(request, options)
        const uri = request.uri
        var puri = global.__ojobHttpRelativePath(uri, options.parentURI)

        var lst, origLst
        var _s3p = listingPrefix(options.parentPath, puri)
        if (args.cache > 0) {
          lst = browseCache("s3").get({ puri: _s3p })
        } else {
          lst = s3.listObjects(args.bucket, _s3p)
          if (_s3p.length > 1) lst = lst.filter(r => r.filename != _s3p)
        }
        origLst = lst
        lst = lst.filter(f => {try {var key=String(f.filename),base=String(options.parentPath||"").replace(/^\/+/,"");if(base && key.startsWith(base))key=key.substring(base.length);args.fns.validate({uri:options.parentURI.replace(/\/$/,"")+"/"+key.replace(/^\/+/,"")},options);return true}catch(e){return false}})
        if (isDef(args.restrict)) {
          if (isString(args.restrict)) args.restrict = [ args.restrict ]
          lst = lst.filter(f => args.restrict.reduce((aP, aC) => (aP && !(new RegExp(aC)).test(f.filename)), true))
        }

        if (origLst.length > 0) {
          var defaultKey = _s3p + options.default
          return {
            isList: true,
            defaultPresent: isDef(options.default) && !(request.params || {}).q &&
              lst.some(row => row.isFile && row.filename === defaultKey),
            fields: [ "Object", "Last modified", "Size", "Size in bytes" ],
            alignFields: [ "left", "left", "right", "right" ],
            key: "Object",
            list: lst.filter(r => r.filename != "/").map(f => {
              var _f = f.filename.replace(/\/$/, "").replace(new RegExp("^.+/"), "")
              return {
                isDirectory: f.isDirectory,
                values: {
                  Object: _f,
                  "Last modified": isUnDef(f.lastModified) ? "" : ow.format.fromDate(new Date(f.lastModified), "yyyy-MM-dd HH:mm:ss"),
                  Size: f.isFile ? ow.format.toBytesAbbreviation(f.size) : "",
                  "Size in bytes": f.isFile ? f.size : ""
                }
              }
            }),
          }
        } else {
          return { isFile: true }
        }
      },
      getObj: (request, options) => {
        args.fns.validate(request, options)
        var relative = global.__ojobHttpRelativePath(request.uri, options.parentURI)
        var object = view.read(s3, args.bucket, options.parentPath + relative, request, options, renderMarkdown)
        if (options.noRaw !== true && !renderMarkdown && !object.stream && !object.jsonViewer && object.type != "md") object.data = '<p><a href="' +
          ow.format.escapeHTML(view.url(options.parentURI, relative)) + '?raw=true" download>Download raw</a></p>' +
          "\n\n" + object.data
        return object
      },
      search: (request, options) => {
        args.fns.validate(request, options)
        const uri = request.uri
        var puri = global.__ojobHttpRelativePath(uri, options.parentURI)

        var q = _$(request.params.q, "q").isString().default(_$(request.params.search).isString().default(""))
        var maxResults = Number(_$(request.params.maxResults).default(options.query && options.query.enabled ? options.query.maxResults || 1000 : 200))
        if (!isFinite(maxResults) || maxResults < 1 || Math.floor(maxResults)!=maxResults || maxResults>1000) {var invalid=new Error("Invalid maxResults");invalid.httpStatus=400;throw invalid}
        if (q.length > (options.query && options.query.maxQueryLength || 256)) {var invalid=new Error("Query too long");invalid.httpStatus=400;throw invalid}

        var _fields      = [ "Object", "Last modified", "Size", "Size in bytes" ]
        var _alignFields = [ "left", "left", "right", "right" ]
        if (q.length == 0) return { isList: true, fields: _fields, alignFields: _alignFields, key: "Object", list: [] }

        var _s3p = listingPrefix(options.parentPath, puri)
        var wildcards = options.query && options.query.enabled && options.query.wildcards === true && request.params.wildcards != "0"
        if (wildcards && !isFunction(support.searchMatcher)) support.error(501, "Wildcard search requires updated oJob-common")
        var shallow = options.query && options.query.enabled && request.params.recursive == "0"
        var scanInfo, lst
        if (support && options.query && options.query.enabled) {
          if (!isFunction(s3.walkObjects)) throw new Error("Enhanced search requires S3.walkObjects; update S3")
          if (!options._api && request.method == "GET") {
            var unit = searchSnapshot(_s3p, options.query, (request.header || {})["x-openaf-browse-fragment"] !== "1", !shallow)
          } else {
            var unit = browseCache("s3-search").ttl(args.cache || 30000).fn(k => {
              var rows = [], info = s3.walkObjects(args.bucket,k.puri,row => { rows.push(row) },options.query,k.recursive)
              return {rows:rows,info:info}
            }).create().get({puri:_s3p, recursive:!shallow})
          }
          lst = unit.rows
          scanInfo = unit.info
        } else lst = s3.listObjects(args.bucket, _s3p, false, true)
        lst = lst.filter(f => {try {var key=String(f.filename),base=String(options.parentPath||"").replace(/^\/+/,"");if(base && key.startsWith(base))key=key.substring(base.length);args.fns.validate({uri:options.parentURI.replace(/\/$/,"")+"/"+key.replace(/^\/+/,"")},options);return true}catch(e){return false}})

        if (isDef(args.restrict)) {
          if (isString(args.restrict)) args.restrict = [ args.restrict ]
          lst = lst.filter(f => args.restrict.reduce((aP, aC) => (aP && !(new RegExp(aC)).test(f.filename)), true))
        }

        var _rel = f => String(f.filename).substring(_s3p.length).replace(/\/$/, "")
        var _q = q.toLowerCase()
        var matches = support && isFunction(support.searchMatcher) ? support.searchMatcher(q, wildcards) : name => name.toLowerCase().indexOf(_q) >= 0
        var _hits = lst.filter(f => (f.isFile || shallow && f.isDirectory) && _rel(f) && matches(_rel(f)))
        var _total = _hits.length
        if (_hits.length > maxResults) _hits = _hits.slice(0, maxResults)
        if (scanInfo && isDef(scanInfo.ready)) {
          scanInfo.message = !scanInfo.ready ? ((request.header || {})["x-openaf-browse-fragment"] === "1" ?
            "Apply to search this prefix." : "Search is busy. Apply to try again.") :
            scanInfo.scanned + " objects scanned · " + _total + " matches" +
            (scanInfo.refreshing ? " so far" : scanInfo.failed ? " · scan stopped on error" :
              !scanInfo.complete ? " · scan limit reached" : "") +
            (_total > maxResults ? " · showing " + maxResults : "")
        }

        return {
          isList: true, fields: _fields, alignFields: _alignFields, key: "Object",
          searchInfo: Object.assign({}, scanInfo || {complete:true,totalExact:true}, {truncated:_total > maxResults || scanInfo && !scanInfo.complete,totalExact:_total <= maxResults && (!scanInfo || scanInfo.complete)}),
          list: _hits.map(f => ({
            isDirectory: f.isDirectory === true,
            values: {
              Object: _rel(f),
              "Last modified": isUnDef(f.lastModified) ? "" : ow.format.fromDate(new Date(f.lastModified), "yyyy-MM-dd HH:mm:ss"),
              Size: f.isFile ? ow.format.toBytesAbbreviation(f.size) : "",
              "Size in bytes": f.isFile ? f.size : ""
            }
          }))
        }
      },
      init  : options => {
        if (args.cache > 0) {
          log("Creating S3 browse cache...")
          browseCache("s3")
          .ttl(args.cache)
          .fn(k => {
            log("  cache get " + af.toSLON(k))
            var _r = s3.listObjects(args.bucket, k.puri)
            if (k.puri.length > 1) _r = _r.filter(r => r.filename != k.puri)
            return _r
          })
          .create()

          // Warm the root cache at startup. A failed load can be retried on the first request.
          if (args.browse !== false) {
            try {
              browseCache("s3").get({ puri: listingPrefix(options ? options.parentPath : args.path, "") })
            } catch (e) {
              logWarn("Could not warm the browse root cache")
            }
          }
        }
      }
    }

    if (provider) {
      args.fns.getStatus = () => provider.status()
      args.fns.getFreshness = (request,options) => {
        var path = global.__ojobHttpRelativePath(request.uri,options.parentURI)
        var freshness = provider.freshness((name,key) => support.matchesUnit(path,key,options.parentPath))
        return syncFn(() => {
          var scan = scans.get(scanKey(listingPrefix(options.parentPath, path), (request.params || {}).recursive != "0"))
          if (scan && (scan.refreshing || now() < scan.expires)) {
            freshness.refreshing = scan.refreshing
            freshness.lastUpdatedAt = Math.max(scan.updatedAt || 0, freshness.lastUpdatedAt || freshness.loadedAt || 0)
          }
          return freshness
        }, scanLock)
      }
      args.fns.refresh = (request, options) => {
        var path = global.__ojobHttpRelativePath(request.uri, options.parentURI).replace(/\/+$/, "")
        var prefix = listingPrefix(options.parentPath, path)
        syncFn(() => scans.forEach((state, key) => { if (state.prefix.startsWith(prefix)) scans.delete(key) }), scanLock)
        provider.invalidate((name,key) => {
          return support.matchesUnit(path,key,options.parentPath)
        })
        args.fns.getList(request, options)
      }
    }

