name: Update packages

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  update-packages:
    runs-on    : ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps      :
    - uses: actions/checkout@v6

    - name: Cache OpenAF runtime
      uses: actions/cache@v5
      with:
        key : oaf-t8
        path: /tmp/oaf

    - name: Update ghcopilot dependencies
      uses: openaf/ojob-action@v7
      with:
        script: |
          var filepath = "ghcopilot"
          var packageFile = filepath + "/.package.yaml"
          var opack = io.readFileYAML(packageFile)

          $sh("rm *.jar")
          .sh(getOpenAFPath() + "ojob ojob.io/oaf/mavenGetJars folder=.")
          .sh(getOpenAFPath() + "ojob ojob.io/oaf/checkOAFJars path=. remove=true versioninsensitive=true")
          .pwd(filepath)
          .get()

          opack.version = ow.loadFormat().fromDate(new Date(), "yyyyMMdd")
          io.writeFileYAML(packageFile, opack)

          $sh(getOpenAFPath() + "opack genpack . --exclude .claude,.github,.openaf_precompiled,tests,test")
          .pwd(filepath)
          .prefix("opack")
          .get()
        dist: t8

    - name: Run updatePacks
      uses: openaf/ojob-action@v7
      with:
        ojob: 'updatePacks.yaml'
        dist: t8

    - name: Commit changes
      env :
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: openaf/ojob-action@v7
      with:
        ojob: 'ojob.io/git/hub/contentIn'
        args: "message=\"Update packs {{date}}/{{time}}\" title=\"Update packs\" branch=\"${{ github.ref_name }}\""
        dist: t8
