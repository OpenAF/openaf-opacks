jobs:
# ------------------------
- name : HTTP Browse - ecr
  to   : HTTP Browse generic
  typeArgs:
    noLog   : false 
    shortcut: &httpBrowseECRTypeArgs
      name  : ECRBrowse
      keyArg: port
      args  : 
        accessKey  : accessKey
        secret     : secret
        token      : token
        region     : region
        assumeRole : assumeRole
        uri        : uri
        path       : path
        browse     : browse
        logo       : logo
        restrict   : restrict
        incURI     : incURI
        cache      : cache
        sortTab    : sortTab
        options    : options
        operationsBrowseUris: operationsBrowseUris
        operationsToken: operationsToken
        s3url      : s3url           # optional s3 url for static markdown description files
        s3accesskey: s3accesskey     # optional s3 access key for static markdown description files
        s3secret   : s3secret        # optional s3 secret for static markdown description files
        s3region   : s3region        # optional s3 region for static markdown description files
        s3bucket   : s3bucket        # optional s3 bucket containing static markdown description files
        s3prefix   : s3prefix        # optional s3 prefix for static markdown description files
  exec : &httpBrowseECRExec | #js
    var support, provider, enhanced = args.options && (args.options.query && args.options.query.enabled || args.options.preview || args.options.operations && args.options.operations.enabled)
    if (enhanced) {
      try { support = require("ojob-browse-contract.js") } catch(e) { throw new Error("Enhanced browsing requires updated oJob-common (browse contract 1)") }
      support.check(args.options, support.capabilities)
      provider = support.provider(args.options)
    }
    if (!support) {
      try { support = require("ojob-browse-contract.js") } catch (e) {}
    }
    var cacheNamespace = "browse-" + genUUID() + "-"
    var browseCache = name => provider ? provider.cache(name) : $cache(cacheNamespace + name)

    args.options = merge(args.options, {
      showURI : args.incURI,
      sortTab : args.sortTab,
      logo    : args.logo,
      browse  : args.browse,
      default : args.default,
      s3url      : args.s3url,
      s3accesskey: args.s3accesskey,
      s3secret   : args.s3secret,
      s3region   : args.s3region,
      s3bucket   : args.s3bucket,
      s3prefix   : args.s3prefix
    })

    loadLib("aws.js")
    loadLib("s3.js")
    var aws, clientLock = new java.lang.Object()
    var getAWS = () => syncFn(() => {
      var expiry = aws && (isDef(aws.assumeRoleExp) ? aws.assumeRoleExp : Date.parse(String(aws._credentialExpiration)))
      if (!aws || isFinite(expiry) && expiry <= now() + 60000) {
        var next = new AWS(args.accessKey, args.secret, args.token, args.region)
        if (isDef(args.assumeRole)) next = next.assumeRole(args.assumeRole)
        aws = next
      }
      return aws
    }, clientLock)
    var imageState = Object.create(null), imageLock = new java.lang.Object()
    var summaryQueue = [], summaryRunning = false
    var imageSlots = new java.util.concurrent.Semaphore(3)
    var imageTTL = isNumber(args.cache) ? args.cache : 5000
    var summarize = images => {
      var summary = { tags: 0, lastPush: 0, lastPull: 0 }
      if (isArray(images)) images.forEach(i => {
        summary.tags += isArray(i.imageTags) ? i.imageTags.length : 0
        summary.lastPush = Math.max(summary.lastPush, i.imagePushedAt || 0)
        summary.lastPull = Math.max(summary.lastPull, i.lastRecordedPullTime || 0)
      })
      return summary
    }
    var readImages = (image, allowStale) => {
      if (!provider) return browseCache("ecr-imgs").get({ image: image })
      var state = syncFn(() => {
        if (!imageState[image]) {
          // Bound the additional summary cache independently of the shared provider.
          if (Object.keys(imageState).length >= 1000) {
            var victim = Object.keys(imageState).filter(key => !imageState[key].refreshing)[0]
            if (isUnDef(victim)) return __
            delete imageState[victim]
          }
          imageState[image] = {}
        }
        return imageState[image]
      }, imageLock)
      var load = () => {
        imageSlots.acquire()
        try {
          var images = browseCache("ecr-imgs").get({ image: image })
          syncFn(() => {
            if (state && imageState[image] === state) {
              if (state.images !== images || isUnDef(state.expiresAt)) {
                state.images = images
                state.summary = summarize(images)
                state.expiresAt = now() + imageTTL
              }
            }
          }, imageLock)
          return images
        } finally { imageSlots.release() }
      }
      if (allowStale) {
        if (!state) return __
        syncFn(() => {
          if ((isUnDef(state.images) || now() >= state.expiresAt) && now() >= (state.retryAt || 0) && !state.refreshing) {
            state.refreshing = true
            summaryQueue.push({ image: image, state: state, load: load })
          }
        }, imageLock)
        return state.images
      }
      return load()
    }

    var startSummaries = () => {
      var start = syncFn(() => {
        if (summaryRunning || !summaryQueue.length) return false
        summaryRunning = true
        return true
      }, imageLock)
      if (!start) return
      // One virtual coordinator drains all queued visible rows, three at a time.
      // parallel4Array has an explicit worker count across supported OpenAF builds.
      var failed = e => {
        syncFn(() => {
          summaryRunning = false
          Object.keys(imageState).forEach(image => { imageState[image].refreshing = false })
          summaryQueue = []
        }, imageLock)
        logWarn("Error scheduling ECR summaries: " + e)
      }
      try {
        $doV(() => {
          try {
            while (true) {
              var batch = syncFn(() => {
                if (!summaryQueue.length) { summaryRunning = false; return [] }
                return summaryQueue.splice(0, 3)
              }, imageLock)
              if (!batch.length) return
              parallel4Array(batch, item => {
                try {
                  if (syncFn(() => imageState[item.image] === item.state, imageLock)) item.load()
                } catch(e) {
                  syncFn(() => { item.state.retryAt = now() + imageTTL }, imageLock)
                  logWarn("Error refreshing ECR summary " + item.image + ": " + e)
                } finally { syncFn(() => { item.state.refreshing = false }, imageLock) }
              }, 3)
            }
          } catch(e) { failed(e) }
        })
      } catch(e) { failed(e) }
    }

    const isDigest = value => isString(value) && /^sha256:[0-9a-f]{64}$/.test(value)
    const escapeDetail = value => String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]))
    const metadataTTL = Math.max(5000, imageTTL)
    const digestTTL = Math.max(300000, metadataTTL)
    const detailCache = new Map(), detailLock = new java.lang.Object()
    const detailSlots = new java.util.concurrent.Semaphore(3)
    const detailLocks = Array.from({ length: 16 }, () => new java.lang.Object())
    const readDetail = (repository, key, ttl, load) => {
      const lock = detailLocks[(new java.lang.String(key).hashCode() & 0x7fffffff) % detailLocks.length]
      return syncFn(() => {
        const hit = syncFn(() => {
          const entry = detailCache.get(key)
          if (!entry || now() - entry.loadedAt >= ttl) return
          detailCache.delete(key)
          detailCache.set(key, entry)
          return entry
        }, detailLock)
        if (hit) return hit.value
        if (!detailSlots.tryAcquire()) {
          const busy = new Error("Image inspector busy")
          busy.httpStatus = 503
          throw busy
        }
        try {
          const value = load()
          syncFn(() => {
            detailCache.delete(key)
            detailCache.set(key, { repository: repository, value: value, loadedAt: now() })
            if (detailCache.size > 32) detailCache.delete(detailCache.keys().next().value)
          }, detailLock)
          return value
        } finally { detailSlots.release() }
      }, lock)
    }

    const inspectImage = (request, options, repository) => {
      const params = request.params || {}
      const tabs = { overview: "Overview", platforms: "Platforms", layers: "Layers", history: "History", config: "Config", manifest: "Manifest", artifacts: "Attached artifacts" }
      const digest = params.image, selected = params.platform, tab = params.tab || "overview"
      const artifactPage = tab == "artifacts" ? params.artifactPage : __
      const error = (status, message) => {
        const e = new Error(message)
        e.httpStatus = status
        throw e
      }
      if (!isDigest(digest) || isDef(selected) && !isDigest(selected) || !Object.prototype.hasOwnProperty.call(tabs, tab) ||
          isDef(artifactPage) && (!isString(artifactPage) || artifactPage.length > 4096)) {
        error(400, "Invalid image inspector selection")
      }
      if (!browseCache("ecr-repo").get({}).lst.some(repo => repo.repositoryName == repository)) error(404, "Repository not found")

      const url = (view, platform) => "?image=" + encodeURIComponent(digest) + "&amp;tab=" + view +
        (platform ? "&amp;platform=" + encodeURIComponent(platform) : "")
      const table = (fields, rows, rowHeader) => '<div class="ecr-detail-table"><table' +
        (fields[0] === "Property" ? ' class="ecr-properties"' : '') + '><thead><tr>' + fields.map(field => "<th scope=\"col\">" + field + "</th>").join("") +
        "</tr></thead><tbody>" + rows.map(row => "<tr>" + row.map((cell, index) => rowHeader && index === 0 ?
          '<th scope="row"><strong>' + cell + '</strong></th>' : '<td>' + cell + '</td>').join("") + "</tr>").join("") + "</tbody></table></div>\n\n"
      const textTable = (fields, rows, rowHeader) => table(fields, rows.map(row => row.map(escapeDetail)), rowHeader)
      const properties = rows => textTable(["Property", "Value"], rows, true)
      const date = value => {
        if (!isNumber(value) && !isString(value)) return ""
        const timestamp = isNumber(value) ? new Date(value * 1000) : new Date(value)
        return isNaN(timestamp.getTime()) ? "" : ow.format.fromDate(timestamp, "yyyy-MM-dd HH:mm:ss")
      }
      const mapRows = value => isMap(value) ? Object.keys(value).sort().map(key => [key, value[key]]) : []
      const fullDigest = selected || digest
      const digestDisclosure = value => isDigest(value) ?
        '<details class="ecr-digest"><summary aria-label="Show full digest"><code>' + value.slice(0, 12) + '…' + value.slice(-4) +
        '</code></summary><code>' + value + '</code></details>' : escapeDetail(value)
      var data = '\n' +
        '<style>.ecr-detail-nav{display:flex;flex-wrap:wrap;gap:.3em .75em;margin-bottom:1em}.ecr-detail-nav [aria-current=page]{font-weight:bold;text-decoration:underline}.ecr-detail-digest,.ecr-detail-table td,.ecr-digest>code,.ecr-annotations th,.ecr-labels th,.ecr-env th{overflow-wrap:anywhere}.ecr-annotations td,.ecr-labels td,.ecr-env td{white-space:pre-wrap}.ecr-digest summary{cursor:pointer;white-space:nowrap;color:#626c78}.markdown-body-dark .ecr-digest summary{color:#a3adb8}.ecr-digest summary:focus-visible,.ecr-detail-nav a:focus-visible{outline:2px solid currentColor;outline-offset:2px}.ecr-detail-table td:last-child{min-width:5em}.ecr-detail-table{overflow:auto}.ecr-detail-table th[scope="row"]{text-align:right}.ecr-properties thead th:first-child,.ecr-labels thead th:first-child,.ecr-env thead th:first-child{text-align:right}.ecr-properties thead th:last-child,.ecr-labels thead th:last-child,.ecr-env thead th:last-child{text-align:left}.ecr-detail-chart{max-width:48rem;position:relative}.ecr-detail-graph{overflow:auto}.ecr-detail-graph svg{max-width:100%;height:auto}</style>\n\n'
      if (selected) {
        data += '<nav class="ecr-detail-digest" aria-label="Image breadcrumb"><a href="' + url("platforms") +
          '">Original image <code>' + escapeDetail(digest.substring(7, 19)) + '</code></a></nav>\n\n'
      }
      data += digestDisclosure(fullDigest) + "\n\n"
      data += '<nav class="ecr-detail-nav" aria-label="Image details">' +
        Object.keys(tabs).map(key => '<a href="' + url(key, selected) + '"' + (key == tab ? ' aria-current="page"' : '') + '>' + tabs[key] + '</a>').join("") + '</nav>\n\n'

      var metadata, root, manifest
      try {
        // Other tabs use only the registry ID from DescribeImages.
        metadata = readDetail(repository, repository + "|describe|" + digest, tab == "overview" ? metadataTTL : digestTTL, () => {
          const result = getAWS().ECR_DescribeImages(args.region, repository, { imageIds: [{ imageDigest: digest }] })
          const image = isArray(result) && result.find(item => item.imageDigest == digest)
          if (!image) error(404, "Image digest not found")
          return image
        })
        const registry = String(metadata.registryId)
        const read = (kind, reference) => readDetail(repository, registry + "|" + repository + "|" + kind + "|" + reference, digestTTL,
          () => getAWS().ECR_ReadRegistryJSON(args.region, registry, repository, kind, reference))
        const artifactsTab = tab == "artifacts"
        if (!artifactsTab || selected) root = read("manifests", digest)
        const entries = root && isArray(root.manifests) ? root.manifests : []
        const descriptorInfo = descriptor => {
          const platform = descriptor.platform || {}, annotations = descriptor.annotations || {}
          const label = [platform.os, platform.architecture, platform.variant].filter(Boolean).join("/")
          const attestation = annotations["vnd.docker.reference.type"] == "attestation-manifest"
          const runnable = !attestation && platform.os && platform.architecture && platform.os != "unknown" && platform.architecture != "unknown"
          return { descriptor: descriptor, label: runnable ? label : attestation ? "Attestation" : "Artifact or unknown platform", runnable: !!runnable }
        }
        const platforms = entries.filter(isMap).map(descriptorInfo)
        const platform = selected && platforms.find(entry => entry.descriptor.digest == selected)
        if (selected && !platform) error(404, "Child digest does not belong to this image index")
        manifest = selected && tab != "platforms" && !artifactsTab ? read("manifests", selected) : root
        const readConfig = () => {
          const config = manifest.config
          if (!config || !isDigest(config.digest) ||
              !["application/vnd.oci.image.config.v1+json", "application/vnd.docker.container.image.v1+json"].includes(config.mediaType)) return
          return read("blobs", config.digest)
        }
        const optionalConfig = () => {
          try { return readConfig() } catch (e) { return __ }
        }
        const singlePlatform = config => config && config.os && config.architecture ?
          [config.os, config.architecture, config.variant].filter(Boolean).join("/") : "Unavailable"
        const prefix = ow.server.httpd.getPrefix(options.port)
        const asset = name => escapeDetail(String(prefix || "").replace(/\/$/, "") + "/js/" + name + ".js")

        if (tab == "artifacts") {
          try {
            const artifacts = readDetail(repository, JSON.stringify([registry, repository, "referrers", fullDigest, artifactPage]), metadataTTL,
              () => getAWS().ECR_ListImageReferrers(args.region, repository, registry, fullDigest, artifactPage))
            if (artifacts.referrers.length) {
              data += table(["Artifact type", "Digest", "Media type", "Bytes", "Status", "Annotations"], artifacts.referrers.map(item => {
                const annotations = mapRows(item.annotations)
                return [escapeDetail(item.artifactType), digestDisclosure(item.digest), escapeDetail(item.mediaType),
                  escapeDetail(item.size), escapeDetail(item.artifactStatus),
                  annotations.length ? '<details><summary>Annotations</summary><dl>' +
                    annotations.map(([key, value]) => '<dt>' + escapeDetail(key) + '</dt><dd>' + escapeDetail(value) + '</dd>').join("") +
                    '</dl></details>' : ""]
              }))
            } else data += "<p>No attached artifacts reported for this digest.</p>\n\n"
            const pageURL = url("artifacts", selected)
            if (artifactPage) data += '<p><a href="' + pageURL + '">First page</a></p>\n\n'
            if (artifacts.nextToken) data += '<p><a href="' + pageURL + '&amp;artifactPage=' + encodeURIComponent(artifacts.nextToken) + '">Next page</a></p>\n\n'
          } catch (e) {
            data += "<p>Attached artifacts are unavailable for this digest. Check ECR access and try again.</p>\n\n"
          }
        } else if (tab == "overview") {
          const overviewConfig = optionalConfig()
          const details = [
            ["Tags", (metadata.imageTags || []).join(", ") || "Untagged"],
            ["Pushed", date(metadata.imagePushedAt)],
            ["Image size reported by ECR", isNumber(metadata.imageSizeInBytes) ? ow.format.toBytesAbbreviation(metadata.imageSizeInBytes) : ""],
            ["Media type", manifest.mediaType || metadata.imageManifestMediaType]
          ]
          if (manifest.artifactType || metadata.artifactMediaType) details.push(["Artifact type", manifest.artifactType || metadata.artifactMediaType])
          if (metadata.imageStatus) details.push(["Status", metadata.imageStatus])
          ;[["Last recorded pull", metadata.lastRecordedPullTime], ["Last archived", metadata.lastArchivedAt],
            ["Last activated", metadata.lastActivatedAt]].forEach(([label, value]) => {
            const formatted = date(value)
            if (formatted) details.push([label, formatted])
          })
          if (platform) details.push([platform.runnable ? "Platform" : "Artifact", platform.label])
          else if (!entries.length) details.push(["Platform", singlePlatform(overviewConfig)])
          else details.push(["Platform entries", entries.length])
          data += properties(details)

          const labels = mapRows(overviewConfig && overviewConfig.config && overviewConfig.config.Labels)
          if (labels.length) {
            data += '<section class="ecr-labels" aria-labelledby="ecr-labels-title"><h3 id="ecr-labels-title"><span aria-hidden="true">🏷️</span> Labels</h3>' +
              textTable(["Key", "Value"], labels, true) + '</section>\n\n'
          }

          const annotations = []
          const addAnnotations = (source, descriptor) => {
            const rows = mapRows(descriptor && descriptor.annotations)
            if (rows.length) annotations.push({ source: source, rows: rows })
          }
          const manifestSource = isArray(manifest.manifests) ? "Image index" : "Manifest"
          addAnnotations(manifestSource, manifest)
          if (platform) addAnnotations("Index descriptor", platform.descriptor)
          else if (manifest === root) {
            platforms.forEach((entry, index) => addAnnotations("Index entry " + (index + 1) + " · " + entry.label, entry.descriptor))
          }
          addAnnotations("Config descriptor", manifest.config)
          if (isArray(manifest.layers)) {
            manifest.layers.forEach((layer, index) => addAnnotations("Layer " + (index + 1), layer))
          }

          if (annotations.length) {
            data += '<section class="ecr-annotations" aria-labelledby="ecr-annotations-title"><h3 id="ecr-annotations-title"><span aria-hidden="true">📝</span> Annotations</h3>' +
              annotations.map(group =>
                (annotations.length > 1 || group.source != manifestSource ? '<h4><span aria-hidden="true">📄</span> ' + escapeDetail(group.source) + '</h4>' : '') +
                textTable(["Key", "Value"], group.rows, true)
              ).join("") + '</section>\n\n'
          }
        } else if (tab == "platforms") {
          if (!platforms.length) data += properties([["Supported platform", singlePlatform(optionalConfig())]])
          else {
            if (platforms.filter(entry => entry.runnable).length > 1 && isDef(getOPackPath("Mermaid"))) {
              const label = value => String(value).replace(/[^A-Za-z0-9 ./_-]/g, "").substring(0, 60)
              const graph = ['flowchart LR', '  root["Image index"]'].concat(platforms.slice(0, 12).map((entry, i) =>
                '  root --> p' + i + '["' + label(entry.label) + '"]'))
              if (platforms.length > 12) graph.push('  root --> more["' + (platforms.length - 12) + ' more in table"]')
              data += '<div id="ecr-platform-graph" class="ecr-detail-graph" hidden data-graph="' + escapeDetail(graph.join("\n")) + '"></div>\n\n'
              data += '<script src="' + asset("mermaid") + '"></script><script>document.addEventListener("DOMContentLoaded", async function(){' +
                'if(!window.mermaid)return; var view=document.getElementById("ecr-platform-graph"); try {' +
                'var previous, queue=Promise.resolve(); function render(){var dark=document.body.classList.contains("markdown-body-dark");if(dark===previous)return;previous=dark;' +
                'queue=queue.then(async function(){mermaid.initialize({startOnLoad:false,securityLevel:"strict",theme:dark?"dark":"default"});' +
                'var diagram=await mermaid.render("ecr-platform-svg",view.dataset.graph);view.innerHTML=diagram.svg;view.hidden=false;}).catch(function(){});}render();new MutationObserver(render).observe(document.body,{attributeFilter:["class"]});}catch(e){} });</script>\n\n'
            }
            data += table(["Platform or artifact", "Digest", "Media type"], platforms.map(entry => {
              const desc = entry.descriptor
              const link = isDigest(desc.digest)
              return [link ? '<a href="' + url("overview", desc.digest) + '">' + escapeDetail(entry.label) + '</a>' : escapeDetail(entry.label),
                digestDisclosure(desc.digest), escapeDetail(desc.mediaType)]
            }))
          }
        } else if (tab == "manifest") {
          data += '<link rel="stylesheet" href="' + escapeDetail(prefix) + '/css/nJSMap.css">\n' +
            '<script src="' + asset("openafsigil") + '"></script><script src="' + asset("njsmap") + '"></script>\n\n'
          data += '<style>#ecr-manifest{overflow:auto}#ecr-manifest .njsmap_valueString{overflow-wrap:anywhere}</style>\n\n'
          // Keep escaped JSON visible if nJSMap is missing or cannot render the manifest.
          data += '<div id="ecr-manifest"><pre><code class="language-json">' +
            escapeDetail(JSON.stringify(manifest, null, 2)) + '</code></pre></div>\n\n'
          data += `<script>
            document.addEventListener("DOMContentLoaded", function() {
              if (!window.nJSMap || typeof nJSMap.mount !== "function") return
              const view = document.getElementById("ecr-manifest")
              try {
                const source = view.querySelector("code").textContent
                const tree = document.createElement("div")
                const theme = () => tree.classList.toggle("njsmap_dark", document.body.classList.contains("markdown-body-dark"))
                theme()
                nJSMap.mount(tree, JSON.parse(source), { collapseAll: source.length >= 1024 * 1024 })
                view.replaceChildren(tree)
                new MutationObserver(theme).observe(document.body, { attributeFilter: ["class"] })
              } catch (error) {}
            })
          </script>\n\n`
        } else if (entries.length && !selected) {
          data += '<p>Select an image in <a href="' + url("platforms") + '">Platforms</a> to view its ' + tabs[tab].toLowerCase() + ".</p>\n\n"
        } else if (tab == "layers") {
          const layers = isArray(manifest.layers) ? manifest.layers : []
          const chartLayers = layers.map((layer, i) => ({ number: i + 1, size: layer.size }))
            .filter(layer => isNumber(layer.size) && isFinite(layer.size) && layer.size >= 0)
            .sort((left, right) => right.size - left.size || left.number - right.number).slice(0, 12)
            .sort((left, right) => left.number - right.number)
          if (chartLayers.length) {
            const chart = { type: "bar", data: { labels: chartLayers.map(layer => "Layer " + layer.number), datasets: [{
              label: "Compressed size (MiB)", data: chartLayers.map(layer => layer.size / 1048576), backgroundColor: "#5488cf", maxBarThickness: 22
            }] }, options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, scales: { x: { beginAtZero: true } } } }
            const caption = chartLayers.length < layers.length ?
              "Largest " + chartLayers.length + " of " + layers.length + " layers · MiB" : "Compressed layer sizes · MiB"
            data += '<p>' + caption + '</p>\n\n'
            data += '<div id="ecr-layer-chart" class="ecr-detail-chart" hidden style="height:' + (80 + chartLayers.length * 26) + 'px"><canvas role="img" aria-label="Largest compressed image layers in manifest order" data-chart="' +
              escapeDetail(JSON.stringify(chart)) + '"></canvas></div>\n\n'
            data += '<script src="' + asset("chart") + '"></script><script>document.addEventListener("DOMContentLoaded", function(){' +
              'if(!window.Chart)return; var view=document.getElementById("ecr-layer-chart"), canvas=view.firstElementChild; try {' +
              'var config=JSON.parse(canvas.dataset.chart), chart, previous;' +
              'function render(){var dark=document.body.classList.contains("markdown-body-dark");if(dark===previous)return;previous=dark;var fg=dark?"#d0d7de":"#414951";' +
              'if(chart)chart.destroy();config.options.scales.x.ticks={color:fg};config.options.scales.x.grid={color:dark?"#30363d":"#d8dee4"};config.options.scales.y={ticks:{color:fg},grid:{display:false}};config.options.plugins={legend:{display:false}};' +
              'view.hidden=false;chart=new Chart(canvas,config);}render();new MutationObserver(render).observe(document.body,{attributeFilter:["class"]});}catch(e){view.hidden=true;} });</script>\n\n'
          }
          if (layers.length) {
            const config = optionalConfig()
            const ids = config && config.rootfs && config.rootfs.diff_ids
            const diffIDs = isArray(ids) && ids.length == layers.length ? ids : null
            const layerFields = ["Layer", "Digest", "Compressed bytes", "Media type"]
            if (diffIDs) layerFields.push("Uncompressed digest (DiffID)")
            data += table(layerFields, layers.map((layer, i) => {
              const row = [i + 1, digestDisclosure(layer.digest), escapeDetail(layer.size), escapeDetail(layer.mediaType)]
              if (diffIDs) row.push(digestDisclosure(diffIDs[i]))
              return row
            }))
          } else data += "No filesystem layers reported.\n\n"
        } else {
          const imageConfig = readConfig()
          if (!imageConfig) {
            data += "Image configuration is unavailable for this manifest.\n\n"
          } else {
            if (tab == "config") {
              const runtime = imageConfig.config || {}
              const configRows = [
                ["Entrypoint", runtime.Entrypoint ? JSON.stringify(runtime.Entrypoint) : ""],
                ["Command", runtime.Cmd ? JSON.stringify(runtime.Cmd) : ""],
                ["Working directory", runtime.WorkingDir], ["User", runtime.User],
                ["Ports", Object.keys(runtime.ExposedPorts || {}).join(", ")]
              ]
              ;[["Created", date(imageConfig.created)], ["Author", imageConfig.author],
                ["Volumes", Object.keys(runtime.Volumes || {}).join(", ")], ["Stop signal", runtime.StopSignal],
                ["Health check", runtime.Healthcheck && JSON.stringify(runtime.Healthcheck)]].forEach(([label, value]) => {
                if (value) configRows.push([label, value])
              })
              data += properties(configRows)
              const envRows = (isArray(runtime.Env) ? runtime.Env : []).filter(isString).map(entry => {
                const separator = entry.indexOf("=")
                return separator < 0 ? [entry, ""] : [entry.slice(0, separator), entry.slice(separator + 1)]
              })
              if (envRows.length) {
                data += '<section class="ecr-env" aria-labelledby="ecr-env-title"><h3 id="ecr-env-title"><span aria-hidden="true">⚙️</span> Environment variables</h3>' +
                  textTable(["Name", "Value"], envRows, true) + '</section>\n\n'
              }
            } else {
              var layerIndex = 0
              const history = isArray(imageConfig.history) ? imageConfig.history : []
              const hasAuthors = history.some(step => step.author)
              const historyFields = ["Step", "Created", "Build command", "Layer", "Comment"]
              if (hasAuthors) historyFields.push("Author")
              data += history.length ? table(historyFields, history.map((step, i) => {
                const layer = !step.empty_layer && (manifest.layers || [])[layerIndex++]
                const row = [i + 1, escapeDetail(step.created), escapeDetail(step.created_by),
                  step.empty_layer ? "Metadata only" : digestDisclosure(layer && layer.digest), escapeDetail(step.comment)]
                if (hasAuthors) row.push(escapeDetail(step.author))
                return row
              }), true) : "No build history reported.\n\n"
            }
          }
        }
      } catch (e) {
        if (e.httpStatus == 404 && !manifest) throw e
        data += e.httpStatus == 403 ? "The registry denied access to this image metadata.\n\n" :
          "Image metadata is unavailable. Try again later.\n\n"
      }
      return { data: data, type: "raw", browseDetail: true }
    }

    // Use the same image rows for the repository listing and contextual search.
    const imageListing = (images, request, options, matches) => {
      const params = request.params || {}
      if (params.sort == "Repository Name") delete params.sort
      if (!params.sort) {
        params.sort = "Pushed"
        if (!params.order) params.order = "desc"
      }
      const fields = ["Tag", "Digest", "Pushed", "Size", "Size in bytes"]
      if (options.usePull) fields.push("Last Pull")
      const rows = []
      images.forEach(image => {
        const digest = image.imageDigest
        if (!isDigest(digest)) return
        const tags = image.imageTags && image.imageTags.length ? image.imageTags : [""]
        tags.forEach(tag => {
          if (matches && !matches(tag || "Untagged") && !matches(digest) && !matches(digest.substring(7))) return
          rows.push({
            imageDigest: digest,
            values: {
              Tag: tag || "Untagged",
              Digest: digest.substring(0, 14) + "…" + digest.slice(-4),
              Pushed: isNumber(image.imagePushedAt) ? ow.format.fromDate(new Date(image.imagePushedAt * 1000), "yyyy-MM-dd HH:mm:ss") : "",
              Size: isNumber(image.imageSizeInBytes) ? ow.format.toBytesAbbreviation(image.imageSizeInBytes) : "",
              "Size in bytes": image.imageSizeInBytes,
              "Last Pull": isNumber(image.lastRecordedPullTime) ? ow.format.fromDate(new Date(image.lastRecordedPullTime * 1000), "yyyy-MM-dd HH:mm:ss") : ""
            },
            sortValues: { Tag: tag || "Untagged", Digest: digest, Pushed: image.imagePushedAt || 0, Size: image.imageSizeInBytes }
          })
        })
      })
      return { isList: true, fields: fields, alignFields: ["left", "left", "left", "right", "right"].concat(options.usePull ? ["left"] : []),
        key: "Tag", list: rows, searchInfo: matches ? { complete: true, totalExact: true, scanned: rows.length } : __ }
    }

    args.fns = {
      validate: (request, options) => {
        var path = global.__ojobHttpRelativePath(request.uri, options.parentURI)
        if (/(^|\/)\.\.(\/|$)/.test(path) || /[\\\x00]/.test(path)) { var denied = new Error("Forbidden"); denied.httpStatus = 403; throw denied }
        var patterns = isString(args.restrict) ? [args.restrict] : (args.restrict || [])
        var prefixes=path.split("/").map((part,i,all)=>all.slice(0,i+1).join("/"))
        if (patterns.some(p => prefixes.some(prefix => new RegExp(p).test(prefix)))) { var denied = new Error("Forbidden"); denied.httpStatus = 403; throw denied }
      },
      init   : () => {
        browseCache("ecr-desc")
        .ttl(args.cache)
        .fn(k => {
          var _s3 
          try {
            _s3 = new S3(args.s3url, args.s3accesskey, args.s3secret, args.s3region)
            var s3key = args.s3prefix + k.uri + ".md"
            log(`Cache ECR description from s3://${args.s3bucket}/${s3key}...`)
            var limit = support.previewLimit()
            var stream = _s3.getObjectStream(args.s3bucket, s3key, 0, limit + 1)
            var preview = support.readPreview(stream, "text", limit)
            if (preview.truncated) {
              logWarn("ECR description exceeds the preview limit")
              return __
            }
            return { result: preview.data, html: support.safeMarkdown(preview.data) }
          } catch(ee) {
            if (ee.message.indexOf("The specified key does not exist.") >= 0) {
              logWarn("No description file found for " + k.uri)
              return __
            } else {
              logWarn("Error initializing S3 client: " + ee.message)
              return __
            }
          } finally {
            if (isDef(_s3)) _s3.close()
          }
        })
        .create()

        browseCache("ecr-imgs")
        .ttl(args.cache)
        .byDefault(true, __)
        .fn(k => {
          if (isDef(args.restrict)) {
            if (isString(args.restrict)) args.restrict = [ args.restrict ]
            if (args.restrict.reduce((aP, aC) => (aP || (new RegExp(aC)).test(k.image)), false)) {
              logWarn("Skip image " + k.image + " because it matches a restrict filter")
              return __
            }
          }
          log(`Cache ECR image ${k.image}...`)
          try {
            var _r = getAWS().ECR_DescribeImages(args.region, k.image, { maxResults: 1000 })
            if (isDef(_r) && isDef(_r.error)) {
              sprintErr(_r)
              throw new Error(af.fromSLON(_r.error))
            }
            if (!isArray(_r)) throw new Error("Invalid ECR image response")
            return _r
          } catch (ee) {
            logWarn("Error retrieving image " + k.image + ": " + ee.message)
            throw new Error(ee)
          }
        })
        .create()

        browseCache("ecr-repo")
        .ttl(args.cache)
        .fn(k => {
          var lst = getAWS().ECR_DescribeRepositories(args.region, { maxResults: 1000 })
          if (!isArray(lst)) throw new Error("Invalid ECR repository response")
          var lstParent = [], byPath = Object.create(null), children = Object.create(null)

          // Apply restrict
          if (isDef(args.restrict)) {
            if (isString(args.restrict)) args.restrict = [ args.restrict ]
            lst = lst.filter(f => args.restrict.reduce((aP, aC) => (aP && !(new RegExp(aC)).test(f.repositoryName)), true))
          }

          $from(lst)
          .sort("repositoryName")
          .select(r => {
            if (isDef(r.repositoryName)) {
              var parts = r.repositoryName.split("/")
              for(var i = 0; i < parts.length; i++) {
                var parent = parts.slice(0, i + 1).join("/")
                if (!byPath[parent]) {
                  var entry = { name: parent, isParent: parent != r.repositoryName, level: i+1, descendants: 0 }
                  byPath[parent] = entry
                  lstParent.push(entry)
                  var directory = parts.slice(0, i).join("/")
                  if (!children[directory]) children[directory] = []
                  children[directory].push(entry)
                  for (var j = 1; j <= i; j++) byPath[parts.slice(0, j).join("/")].descendants++
                }
                if (parent == r.repositoryName) byPath[parent].isParent = false
              }
            }
          })

          return { lst: lst, lstParent: lstParent, byPath: byPath, children: children }
        })
        .create()

        // Warm the root cache at startup. A failed load can be retried on the first request.
        if (args.browse !== false) {
          try {
            browseCache("ecr-repo").get({})
          } catch (e) {
            logWarn("Could not warm the browse root cache")
          }
        }
      },
      getList: (request, options) => {
        args.fns.validate(request, options)
        var puri = global.__ojobHttpRelativePath(request.uri, options.parentURI).replace(/\/+$/, "")

        // Root level
        var _r = browseCache("ecr-repo").get({})
        if (puri.length > 0 && !_r.byPath[puri]) {
          // Not found
          return { isFile: false }
        } else {
          if (_r.byPath[puri] && !_r.byPath[puri].isParent) {
            if (!options._api && options.imageDetails === true && options.query && options.query.enabled &&
                !(request.params || {}).image && !(request.params || {}).action) {
              const images = readImages(puri, false)
              const listing = imageListing(images, request, options)
              // Retain the repository description and the pull and artifact tables.
              if ((request.header || {})["x-openaf-browse-fragment"] !== "1") {
                listing.content = readRepositoryDetail(request, options, images).data
                listing.hideContentOnSearch = true
              }
              return listing
            }
            return { isFile: true }
          }

          var _fields  = options.usePull ? [ "Repository Name", "# images", "# tags", "Last Push", "Last Pull" ] : [ "Repository Name", "# images", "# tags", "Last Push" ]
          var _aFields = options.usePull ? [ "left", "right", "right", "left", "left" ] : [ "left", "right", "right", "left" ]

          // Check for markdown description in S3
          var useMDDesc = isDef(options.s3bucket) && isDef(options.s3prefix), mddesc = __
          if (useMDDesc) {
            mddesc = browseCache("ecr-desc").get({ uri: puri })
            if (!mddesc || !isString(mddesc.html)) {
              log(`No cached description found for image list ${puri}`)
              useMDDesc = false
            }
          }

          var candidates = (_r.children[puri] || []).slice()
          candidates = candidates.filter(f => {try {args.fns.validate({uri:options.parentURI.replace(/\/$/,"")+"/"+f.name},options);return true}catch(e){return false}})
          var pageResult
          if (support && options.query && options.query.enabled) {
            pageResult = support.query({isList:true,fields:["Repository Name"],key:"Repository Name",list:candidates.map(f=>({isDirectory:f.isParent,values:{"Repository Name":f.name},entry:f}))},request,options)
            candidates = pageResult.list.map(r=>r.entry)
          }
          var rows = new Array(candidates.length)
          var makeValues = f => {
            var img, summary
            if (!f.isParent && options.summaries !== false) {
              img = readImages(f.name, true)
              summary = syncFn(() => imageState[f.name] && imageState[f.name].summary, imageLock)
              if (!summary && isArray(img)) summary = summarize(img)
            }
            summary = summary || { tags: "", lastPush: 0, lastPull: 0 }
            return {
              isDirectory: f.isParent,
              values: {
                "Repository Name": puri.length > 0 ? f.name.substring(puri.length + 1) : f.name,
                "# images": f.isParent && f.descendants ? f.descendants : "",
                "# tags": summary.tags,
                "Last Push": summary.lastPush > 0 ? new Date(summary.lastPush * 1000).toISOString().replace(/T/, " ").replace(/\..+/, "") : "",
                "Last Pull": summary.lastPull > 0 ? new Date(summary.lastPull * 1000).toISOString().replace(/T/, " ").replace(/\..+/, "") : ""
              }
            }
          }
          rows = candidates.map(makeValues)
          if (provider) startSummaries()
          return {
            pageInfo: pageResult ? pageResult.pageInfo : __,
            queryInfo: pageResult ? pageResult.queryInfo : __,
            sortInfo: pageResult ? pageResult.sortInfo : __,
            sortFields: ["Repository Name"],
            isList: true,
            fields: _fields,
            alignFields: _aFields,
            content: useMDDesc ? mddesc.html : __,
            key   : [ "Repository Name" ],
            list  : rows
          }
        }
      },
      getObj: (request, options, images) => {
        args.fns.validate(request, options)
        var puri = global.__ojobHttpRelativePath(request.uri, options.parentURI).replace(/\/+$/, "")

        var params = request.params || {}
        if (!options._api && !params.action && options.imageDetails === true && isDef(params.image)) {
