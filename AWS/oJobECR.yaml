        }

        if (isUnDef(img)) {
          if (options._api) return { data: { error: "Problem retrieving image data" }, type: "json" }
          data = "**Problem retrieving image data**"
        } else {
          var reg = _$(options.registry).default("")
          if (reg.length > 0) reg += "/"

          // Check for markdown description in S3
          var useMDDesc = isDef(options.s3bucket) && isDef(options.s3prefix), mddesc = __
          if (useMDDesc) {
            mddesc = browseCache("ecr-desc").get({ uri: puri })
            if (!mddesc || !isString(mddesc.html)) {
              log(`No cached description found for image ${puri}`)
              useMDDesc = false
            }
          }

          if (options._api) return { data: { ecrdesc: useMDDesc ? { result: mddesc.result } : __, ecrimgs: img }, type: "json" }

          // Use one row per tag so aliases on the same digest can sort independently.
          const compareTag = support && isFunction(support.compareValues) ? support.compareValues :
            (left, right) => isFunction(ow.format.compareVersion) ? ow.format.compareVersion(left, right) : left.localeCompare(right)
          const tagRows = []
          img.forEach(image => {
            const tags = image.imageTags || []
            ;(tags.length ? tags : [""]).forEach(tag => tagRows.push({ image: image, tag: tag }))
          })
          const compareTagRows = (left, right) => {
            if (!left.tag || !right.tag) return Number(!left.tag) - Number(!right.tag) ||
              String(left.image.imageDigest).localeCompare(String(right.image.imageDigest))
            return compareTag(left.tag, right.tag) || (right.image.imagePushedAt || 0) - (left.image.imagePushedAt || 0) ||
              String(left.image.imageDigest).localeCompare(String(right.image.imageDigest))
          }
          tagRows.sort(compareTagRows)
          const tagLabel = row => {
            const image = row.image
            if (options.imageDetails !== true || !isDigest(image.imageDigest)) return escapeDetail(row.tag)
            return '<a href="?image=' + encodeURIComponent(image.imageDigest) + '">' +
              escapeDetail(row.tag || image.imageDigest.substring(7, 19)) + '</a>'
          }
          const reference = row => reg + puri + (row.tag ? ":" + row.tag : "@" + row.image.imageDigest)
          const detailTable = (name, columns, renderRow) => {
            const requested = params.detailTable == name && ["asc", "desc"].includes(params.detailOrder) ?
              columns.findIndex(column => column[0] == params.detailSort) : -1
            const selected = requested < 0 && name == "details" ? columns.findIndex(column => column[0] == "Pushed at") : requested
            const order = requested < 0 ? "desc" : params.detailOrder
            const rows = selected < 0 ? tagRows : tagRows.slice().sort((left, right) => {
              const [label, value] = columns[selected]
              const a = value(left), b = value(right)
              const result = label == "Tag" ? compareTag(a, b) :
                isNumber(a) && isNumber(b) ? a - b : String(a == null ? "" : a).localeCompare(String(b == null ? "" : b))
              return (order == "desc" ? -result : result) || compareTagRows(left, right)
            })
            const controls = (column, index) => {
              if (!options.sortTab) return ""
              const keep = ["sort", "order", "page", "size", "pageSize"].filter(key => isDef(params[key]))
                .map(key => key + "=" + encodeURIComponent(params[key]))
              return '<span class="sorter-container ecr-server-sort" tabindex="0" aria-label="Sort ' + column + '">' +
                [["asc", "&#9650;", "Ascending"], ["desc", "&#9660;", "Descending"], ["none", "x", "Reset"]].map(([direction, symbol, label]) => {
                  const active = index == selected && direction == order
                  const query = direction == "none" ? keep :
                    keep.concat(["detailTable=" + name, "detailSort=" + encodeURIComponent(column), "detailOrder=" + direction])
                  return '<a class="sort-button' + (active ? ' active' : '') + '" href="?' + query.join("&amp;") +
                    '" aria-label="' + label + ' ' + column + '" title="' + label + ' ' + column + '"' +
                    (active ? ' aria-current="true"' : '') + '>' + symbol + '</a>'
                }).join("") + '</span>'
            }
            const alignment = column => column[2] == ":---:" ? ' style="text-align:center"' :
              column[2] == "---:" ? ' style="text-align:right"' : ""
            return '<table' + (options.sortTab ? ' data-browse-server-sort' : '') + '><thead><tr>' +
              columns.map((column, index) => '<th scope="col"' + alignment(column) + '>' + column[0] +
                controls(column[0], index) + '</th>').join("") + '</tr></thead><tbody>' +
              rows.map(row => '<tr>' + renderRow(row).map((cell, index) =>
                '<td' + alignment(columns[index]) + '>' + cell + '</td>').join("") + '</tr>').join("") +
              '</tbody></table>\n'
          }
          data = "\n"
          if (options.sortTab) {
            data += '<style>.ecr-server-sort{float:right;font-size:10px;margin-left:4px}.ecr-server-sort a{display:none;margin:0 2px}.ecr-server-sort a.active,th:hover .ecr-server-sort a,th:focus-within .ecr-server-sort a{display:inline-block}</style>\n\n'
          }
          data += "## Contents\n\n"
          if (useMDDesc) {
            var s3key = options.s3prefix + puri + ".md"
            data += "* [📰 Description](#📰-description)\n"
          }
          if (!images) data += "* [🏷️ Details per tag](#🏷️-details-per-tag)\n"
          data += "* [💾 How to retrieve each](#💾-how-to-retrieve-each)\n"
          data += "* [🔎 Manifest and artifact types per tag](#🔎-manifest-and-artifact-types-per-tag)\n"
          data += "\n---\n"

          if (useMDDesc) {
            data += "### 📰 Description\n\n"
            data += mddesc.html
            data += "\n---\n"
          }

          if (!images) {
            data += "### 🏷️ Details per tag\n\n"
            const columns = [["Tag", row => row.tag, ":---:"], ["Digest", row => row.image.imageDigest, ":---:"],
              ["Pushed at", row => row.image.imagePushedAt || 0]]
            if (options.usePull) columns.push(["Last Pull", row => row.image.lastRecordedPullTime])
            columns.push(["Size", row => row.image.imageSizeInBytes, "---:"], ["Size in bytes", row => row.image.imageSizeInBytes, "---:"])
            data += detailTable("details", columns, row => {
              const i = row.image
              const date = seconds => isNumber(seconds) ? ow.format.fromDate(new Date(seconds * 1000), "yyyy-MM-dd HH:mm:ss") : ""
              const values = [tagLabel(row), escapeDetail(i.imageDigest.split(":").pop().substring(0, 7)) + "...", date(i.imagePushedAt)]
              if (options.usePull) values.push(date(i.lastRecordedPullTime))
              return values.concat([escapeDetail(ow.format.toBytesAbbreviation(i.imageSizeInBytes)), escapeDetail(i.imageSizeInBytes)])
            })
          }

          data += "\n---\n\n### 💾 How to retrieve each\n\n"
          if (isDef(options.refLink)) {
            data += "> **Note:** Click on the corresponding link, on the 'To retrieve' column, to get instructions on how to pull the image.\n\n"
          }
          data += detailTable("pull", [["Tag", row => row.tag, ":---:"], ["Digest", row => row.image.imageDigest],
            ["To retrieve", reference]], row => {
            const i = row.image
            const ref = reference(row)
            const pull = isDef(options.refLink) ?
              '<a href="' + escapeDetail($t(options.refLink, { image: ref, type: i.artifactMediaType })) + '">' + escapeDetail(ref) + '</a>' :
              '<code>' + escapeDetail(ref) + '</code>'
            return [tagLabel(row), '<code>' + escapeDetail(i.imageDigest) + '</code>', pull]
          })

          data += "\n---\n\n### 🔎 Manifest and artifact types per tag\n\n"
          data += detailTable("manifest", [["Tag", row => row.tag, ":---:"], ["Digest", row => row.image.imageDigest],
            ["Manifest Type", row => row.image.imageManifestMediaType], ["Artifact Type", row => row.image.artifactMediaType]], row => {
            const i = row.image
            return [tagLabel(row), "<code>" + escapeDetail(i.imageDigest) + "</code>",
              escapeDetail(i.imageManifestMediaType), escapeDetail(i.artifactMediaType)]
          })
        }

        return {
          data: data,
          type: "raw"
        }
      }
    }

    const readRepositoryDetail = args.fns.getObj

    if (provider) {
      args.fns.search = (request,options) => {
        args.fns.validate(request, options)
        if (!options.query || !options.query.enabled) support.error(501,"Enhanced search is not enabled")
        var path=global.__ojobHttpRelativePath(request.uri,options.parentURI).replace(/\/+$/, ""), q=String((request.params||{}).q||"")
        if(q.length>(options.query.maxQueryLength||256))support.error(400,"Query too long")
        if (options.query.wildcards === true && !isFunction(support.searchMatcher)) support.error(501, "Wildcard search requires updated oJob-common")
        var literal = q.toLowerCase()
        var matches = isFunction(support.searchMatcher) ? support.searchMatcher(q, options.query.wildcards === true && (request.params || {}).wildcards != "0") : name => name.toLowerCase().indexOf(literal) >= 0
        var repositories = browseCache("ecr-repo").get({})
        if ((!options._api || (request.params || {}).recursive == "0") && options.imageDetails === true && repositories.byPath[path] && !repositories.byPath[path].isParent) {
          return imageListing(readImages(path, false), request, options, matches)
        }
        if (["Tag", "Digest", "Pushed", "Size", "Size in bytes", "Last Pull"].includes((request.params || {}).sort)) delete request.params.sort
        if ((request.params || {}).recursive == "0") {
          var children = repositories.children[path] || [], rows = [], max = options.query.maxResults || 1000
          for (var child of children) {
            var name = path ? child.name.substring(path.length + 1) : child.name
            if (!matches(name)) continue
            try { args.fns.validate({uri:options.parentURI.replace(/\/$/, "") + "/" + child.name}, options) } catch (e) { continue }
            rows.push({isDirectory:child.isParent, values:{"Repository Name":name}})
            if (rows.length > max) break
          }
          var complete = rows.length <= max
          return {isList:true, fields:["Repository Name"], alignFields:["left"], key:"Repository Name", list:rows.slice(0,max),
            searchInfo:{complete:complete, truncated:!complete, totalExact:complete}}
        }
        var all=repositories.lst.filter(r=>(!path||r.repositoryName.startsWith(path+"/"))&&matches(r.repositoryName))
        all=all.filter(r=>{try{args.fns.validate({uri:options.parentURI.replace(/\/$/,"")+"/"+r.repositoryName},options);return true}catch(e){return false}})
        var max=options.query.maxResults||1000
        return {isList:true,fields:["Repository Name"],alignFields:["left"],key:"Repository Name",list:all.slice(0,max).map(r=>({isDirectory:false,values:{"Repository Name":path?r.repositoryName.substring(path.length+1):r.repositoryName}})),searchInfo:{complete:all.length<=max,truncated:all.length>max,totalExact:all.length<=max,scanned:all.length}}
      }
      args.fns.getStatus = () => provider.status()
      args.fns.getFreshness = (request,options) => {
        var path = global.__ojobHttpRelativePath(request.uri,options.parentURI)
        var freshness = provider.freshness((name,key) => support.matchesUnit(path,key,options.parentPath))
        freshness.refreshing = syncFn(() => Object.keys(imageState).some(image => imageState[image].refreshing && support.matchesUnit(path, { image: image }, options.parentPath)), imageLock)
        return freshness
      }
      args.fns.refresh = (request, options) => {
        var path = global.__ojobHttpRelativePath(request.uri, options.parentURI).replace(/\/+$/, "")
        // Wait for in-flight image loads before invalidating, so they cannot republish old data.
        imageSlots.acquire(3)
        try {
          syncFn(() => {
            summaryQueue = summaryQueue.filter(item => !support.matchesUnit(path, { image: item.image }, options.parentPath))
            Object.keys(imageState).forEach(image => {
              if (support.matchesUnit(path, { image: image }, options.parentPath)) delete imageState[image]
            })
          }, imageLock)
          provider.invalidate((name,key) => support.matchesUnit(path,key,options.parentPath))
        } finally { imageSlots.release(3) }
        detailSlots.acquire(3)
        try {
          syncFn(() => {
            detailCache.forEach((entry, key) => {
              if (support.matchesUnit(path, { image: entry.repository }, options.parentPath)) detailCache.delete(key)
            })
          }, detailLock)
        } finally { detailSlots.release(3) }
        args.fns.getList(request, options)
      }
    }

