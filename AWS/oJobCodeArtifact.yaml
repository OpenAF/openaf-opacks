include:
- oJobHTTPd.yaml
- oJobBrowse.yaml

#ojob:
#  catch: $err(exception, __, __, job.exec)
#  daemon: true
#  logToConsole: true

jobs:
# ---------------------------------
- name : HTTP Browse - codeartifact
  to   : HTTP Browse generic
  typeArgs:
    noLog   : false
    shortcut: &httpBrowseCodeArtifactTypeArgs
      name  : CodeArtifactBrowse
      keyArg: port
      args  :
        accessKey : accessKey
        secret    : secret
        token     : token
        region    : region
        assumeRole: assumeRole
        uri       : uri
        path      : path
        browse    : browse
        logo      : logo
        incURI    : incURI
        cache     : cache
        sortTab   : sortTab
        options   : options
        operationsBrowseUris: operationsBrowseUris
        domain    : domain
        repository: repository
        format    : format
        namespace : namespace
        initialize: initialize
        download  : download
  exec : &httpBrowseCodeArtifactExec | #js
    var prefetchEnabled = args.options && args.options.prefetch === true && (!isNumber(args.cache) || args.cache > 0)
    var support, provider, enhanced = args.options && (args.options.query && args.options.query.enabled || args.options.preview || args.options.operations && args.options.operations.enabled || prefetchEnabled)
    if (enhanced) {
      try { support = require("ojob-browse-contract.js") } catch(e) { throw new Error("Enhanced browsing requires updated oJob-common (browse contract 1)") }
      support.check(args.options, support.capabilities)
      provider = support.provider(args.options)
    }
    // Legacy version listings also use the Browse comparator when it is available.
    if (!support) {
      try { support = require("ojob-browse-contract.js") } catch (e) {}
    }
    var cacheNamespace = "browse-" + genUUID() + "-"
    var browseCache = name => provider ? provider.cache(name) : $cache(cacheNamespace + name)

    args.options = merge(args.options, {
      showURI : args.incURI,
      sortTab : args.sortTab,
      logo    : args.logo,
      browse  : args.browse,
      default : args.default,
      download: args.download
    })

    loadLib("aws.js")
    var aws, clientLock = new java.lang.Object()
    var getAWS = () => syncFn(() => {
      var expiry = aws && (isDef(aws.assumeRoleExp) ? aws.assumeRoleExp : Date.parse(String(aws._credentialExpiration)))
      if (!aws || isFinite(expiry) && expiry <= now() + 60000) {
        var next = new AWS(args.accessKey, args.secret, args.token, args.region)
        if (isDef(args.assumeRole)) next = next.assumeRole(args.assumeRole)
        aws = next
      }
      return aws
    }, clientLock)

    var packagePath = pkg => {
      var parts = [pkg.format]
      if (isDef(pkg.namespace) && pkg.namespace.length > 0) parts.push(pkg.namespace)
      parts.push(pkg.package)
      return parts.join("/")
    }

    var buildPackageTree = aPackages => {
      var _packages = (aPackages || []).map(pkg => merge({ path: packagePath(pkg) }, pkg))

      var _parents = []
      var _parentsMap = Object.create(null)
      var _childrenMap = Object.create(null)
      var _leafByPath = Object.create(null)

      for(var i = 0; i < _packages.length; i++) {
        var r = _packages[i]
        var parts = r.path.split("/")
        for(var j = 0; j < parts.length; j++) {
          var parent = parts.slice(0, j + 1).join("/")
          var key = parent + "|" + (j + 1)
          if (!isDef(_parentsMap[key])) {
            var entry = { name: parent, isParent: parent != r.path, level: j + 1, pkg: r }
            _parentsMap[key] = entry
            _parents.push(entry)
            var prefix = parts.slice(0, j).join("/")
            if (!isDef(_childrenMap[prefix])) _childrenMap[prefix] = []
            _childrenMap[prefix].push(parent)
          } else if (parent == r.path) {
            _parentsMap[key].isParent = false
            _parentsMap[key].pkg = r
          }
        }
        _leafByPath[r.path] = r
      }

      Object.keys(_childrenMap).forEach(k => _childrenMap[k].sort())

      return { list: _packages, parents: _parents, parentsMap: _parentsMap, childrenMap: _childrenMap, leafByPath: _leafByPath }
    }

    // Share the same repository snapshots and locks on prefetch, refresh, and navigation.
    var treeState = Object.create(null), treeLock = new java.lang.Object()
    var treeSlots = new java.util.concurrent.Semaphore(3), prefetchSlot = new java.util.concurrent.Semaphore(1)
    var treeTTL = isNumber(args.cache) ? args.cache : 5000
    var prefetchStats = { queued: $atomic(0), loaded: $atomic(0), used: $atomic(0) }
    var treeUnit = key => provider.entries("codeartifact-package-tree").find(u =>
      u.key.domain == key.domain && u.key.repository == key.repository)

    var queueTree = (key, speculative) => {
      var id = stringify(key, __, "")
      var state = syncFn(() => {
        Object.keys(treeState).forEach(k => {
          if (!treeState[k].refreshing && now() >= treeState[k].retryAt) delete treeState[k]
        })
        if (treeState[id] || Object.keys(treeState).length >= 1000) return __
        if (speculative && !prefetchSlot.tryAcquire()) return __
        var next = { key: key, refreshing: true, speculative: speculative, pages: [] }
        treeState[id] = next
        return next
      }, treeLock)
      if (!state) return false

      var discard = () => syncFn(() => { if (treeState[id] === state) delete treeState[id] }, treeLock)
      var failed = e => {
        syncFn(() => {
          if (treeState[id] === state) {
            state.refreshing = false
            state.retryAt = now() + Math.max(1000, treeTTL)
          }
        }, treeLock)
        logWarn("Error refreshing CodeArtifact packages: " + e)
      }
      try {
        $doV(() => {
          var acquired = false
          try {
            if (speculative) {
              // A speculative miss must not queue behind normal navigation.
              if (!treeSlots.tryAcquire()) { discard(); return }
            } else {
              treeSlots.acquire()
            }
            acquired = true
            // Explicit refresh cancels queued work before invalidating snapshots.
            if (!syncFn(() => treeState[id] === state, treeLock)) return
            if (speculative && treeUnit(key)) { discard(); return }
            browseCache("codeartifact-package-tree").get(key)
            syncFn(() => {
              if (treeState[id] !== state) return
              if (!speculative) { delete treeState[id]; return }
              prefetchStats.loaded.inc()
              state.refreshing = false
              state.prefetched = true
              state.retryAt = now() + treeTTL
              if (state.visited) {
                prefetchStats.used.inc()
                delete treeState[id]
              }
            }, treeLock)
          } catch (e) { failed(e) }
          finally {
            if (acquired) treeSlots.release()
            if (speculative) prefetchSlot.release()
          }
        })
        if (speculative) prefetchStats.queued.inc()
        return true
      } catch (e) {
        if (speculative) prefetchSlot.release()
        failed(e)
        return false
      }
    }

    var readTree = (key, navigation) => {
      if (!provider) return browseCache("codeartifact-package-tree").get(key)
      var unit = treeUnit(key)
      if (navigation && prefetchEnabled) {
        var id = stringify(key, __, "")
        syncFn(() => {
          var state = treeState[id]
          if (!state || !state.speculative) return
          if (state.refreshing) state.visited = true
          if (state.prefetched && now() < state.retryAt && (unit || treeUnit(key))) {
            prefetchStats.used.inc()
            delete treeState[id]
          }
        }, treeLock)
      }
      if (!unit) {
        treeSlots.acquire()
        try { return browseCache("codeartifact-package-tree").get(key) }
        finally { treeSlots.release() }
      }
      if (now() >= unit.expiresAt) queueTree(key, false)
      return unit.value
    }

    const repositoryPrefetch = `<script>
      (function() {
        const directory = location.pathname.replace(/\\/?$/, '/')
        const requested = new Set()
        let hovered, focused, target, timer
        const repository = event => event.target instanceof Element && event.target.closest('#browse-listing tbody td:nth-child(2) a')
        const update = next => {
          if (target === next) return
          clearTimeout(timer)
          target = next
          if (!next) return
          const url = new URL(next.href)
          if (url.origin !== location.origin || !url.pathname.startsWith(directory) ||
              !/^[^/]+\\/?$/.test(url.pathname.slice(directory.length)) || requested.has(url.pathname)) return
          timer = setTimeout(() => {
            if (!next.isConnected) return
            requested.add(url.pathname)
            url.search = '?_browsePrefetch=1'
            fetch(url, { credentials:'same-origin', cache:'no-store', redirect:'error', headers:{'X-OpenAF-Browse-Prefetch':'1'} }).catch(() => {})
          }, 225)
        }
        document.addEventListener('pointerover', event => {
          if (event.pointerType === 'touch') return
          hovered = repository(event)
          if (hovered) update(hovered)
        })
        document.addEventListener('pointerout', event => {
          if (hovered && repository(event) === hovered && !hovered.contains(event.relatedTarget)) {
            if (target === hovered) update(focused)
            hovered = undefined
          }
        })
        document.addEventListener('focusin', event => {
          focused = repository(event)
          update(focused || hovered)
        })
        document.addEventListener('focusout', event => {
          if (focused && !focused.contains(event.relatedTarget)) {
            if (target === focused) update(hovered)
            focused = undefined
          }
        })
      })()
    </script>`

    var getPaging = (page, pageSize) => {
      var _pageSize = isDef(pageSize) ? Number(pageSize) : Number(isDef(args.pageSize) ? args.pageSize : (args.options || {}).pageSize)
      if (isNaN(_pageSize) || _pageSize <= 0) _pageSize = 0
      var _page = isDef(page) ? Number(page) : Number(isDef(args.page) ? args.page : (args.options || {}).page)
      if (isNaN(_page) || _page <= 0) _page = 1
      return { pageSize: _pageSize, page: _page }
    }

    var applyPaging = (aList, page, pageSize) => {
      var p = enhanced && args.options.query && args.options.query.enabled ? {page:1,pageSize:0} : getPaging(page, pageSize)
      var _list = isArray(aList) ? aList : []
      var total = _list.length

      if (p.pageSize <= 0) {
        return {
          list       : _list,
          total      : total,
          page       : 1,
          pageSize   : 0,
          totalPages : 1,
          hasPrevious: false,
          hasNext    : false
        }
      }

      var totalPages = Math.max(1, Math.ceil(total / p.pageSize))
      var currentPage = Math.min(Math.max(1, p.page), totalPages)
      var start = (currentPage - 1) * p.pageSize

      return {
        list       : _list.slice(start, start + p.pageSize),
        total      : total,
        page       : currentPage,
        pageSize   : p.pageSize,
        totalPages : totalPages,
        hasPrevious: currentPage > 1,
        hasNext    : currentPage < totalPages
      }
    }

    var withPagingInfo = (lst, pageInfo) => merge({
      pageInfo: {
        total      : pageInfo.total,
        page       : pageInfo.page,
        pageSize   : pageInfo.pageSize,
        totalPages : pageInfo.totalPages,
        hasPrevious: pageInfo.hasPrevious,
        hasNext    : pageInfo.hasNext
      }
    }, lst)

    // Paging options: pageSize/page can be passed as args or via args.options
    const escapeAsset = value => String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]))
    const assetFormat = (name, options) => support && options.preview &&
      support.format(name, options.preview, Object.assign({}, support.defaults, { htm: "html", html: "html", pom: "xml", xml: "xml" }))
    const assetURL = (name, mode) => "?asset=" + encodeURIComponent(name) +
      (mode == "raw" ? "&amp;raw=true" : mode == "source" ? "&amp;view=source" : "")

    const renderAssetPreview = (preview, type, name, request, options) => {
      const path = global.__ojobHttpRelativePath(request.uri, options.parentURI)
      const versionURL = escapeAsset(ow.server.httpd.withPrefix(options.port, options.parentURI.replace(/\/$/, "") + "/" +
        path.split("/").map(encodeURIComponent).join("/")))
      const url = mode => versionURL + assetURL(name, mode)
      const prefix = escapeAsset(ow.server.httpd.getPrefix(options.port))
      // An HTML block keeps Showdown from encoding the already escaped source a second time.
      const source = (language, content) => '<div><pre><code class="language-' + escapeAsset(language) + '">' +
        escapeAsset(content) + "</code></pre></div>\n\n"
      const showingSource = request.params.view == "source"
      const showModes = ["html", "xml", "json"].includes(type)
      var data = '\n<style>.codeartifact-actions{display:flex;flex-wrap:wrap;gap:.35em 1em;margin-bottom:1em}.codeartifact-actions a{white-space:nowrap}.codeartifact-actions a[aria-current]{font-weight:600;text-decoration:underline}.codeartifact-actions a:focus-visible{outline:2px solid currentColor;outline-offset:2px}.codeartifact-frame{display:block;box-sizing:border-box;width:100%;height:65vh;border:1px solid #b8c0c8;border-radius:4px;color-scheme:light}.markdown-body-dark .codeartifact-frame{border-color:#444c56;color-scheme:dark}@media(max-width:600px){.codeartifact-frame{height:42vh}}</style>\n\n'
      data += '<h3 style="overflow-wrap:anywhere">' + escapeAsset(name) + '</h3>\n\n'
      if (showModes || options.download) {
        data += '<nav class="codeartifact-actions" aria-label="Asset views and actions">'
        if (showModes) {
          data += '<a href="' + url("preview") + '"' + (!showingSource ? ' aria-current="page"' : '') + '>Preview</a>' +
            '<a href="' + url("source") + '"' + (showingSource ? ' aria-current="page"' : '') + '>Source</a>'
        }
        if (options.download) data += '<a href="' + url("raw") + '">Download raw</a>'
        data += '</nav>\n\n'
      }

      if (preview.truncated) {
        data += "<p>Preview truncated at the configured size limit.</p>\n\n" + source("text", preview.data.replace(/\n\n\[Preview truncated; download the complete file\.\]$/, ""))
      } else if (type == "html" && !showingSource) {
        const jsoup = getOPackPath("Jsoup")
        if (isDef(jsoup)) {
          // Parse without network access and retain only static content and layout.
          loadExternalJars(jsoup)
          const allow = new Packages.org.jsoup.safety.Safelist()
          ;["article", "section", "header", "footer", "main", "div", "span", "p", "br", "hr", "h1", "h2", "h3",
            "h4", "h5", "h6", "ul", "ol", "li", "dl", "dt", "dd", "table", "thead", "tbody", "tfoot", "tr",
            "th", "td", "caption", "a", "pre", "code", "blockquote", "em", "strong", "b", "i", "u", "s",
            "small", "sup", "sub"].forEach(tag => allow.addTags(tag))
          allow.addAttributes("td", "colspan", "rowspan")
          allow.addAttributes("th", "colspan", "rowspan", "scope")
          const html = Packages.org.jsoup.Jsoup.clean(String(preview.data), allow)
          const csp = "default-src 'none'; base-uri 'none'; form-action 'none'; style-src 'unsafe-inline'"
          const document = '<!doctype html><meta http-equiv="Content-Security-Policy" content="' + csp +
            '"><meta name="color-scheme" content="light dark"><style>body{background:Canvas;color:CanvasText;font:16px system-ui;padding:.75em;overflow-wrap:anywhere}pre{white-space:pre-wrap}table{border-collapse:collapse}th,td{padding:.3em;border:1px solid GrayText}</style>' + html
          data += '<iframe title="HTML asset preview" sandbox="" referrerpolicy="no-referrer" class="codeartifact-frame" srcdoc="' +
            escapeAsset(document) + '"></iframe>\n\n'
        } else {
          data += "<p>Install the Jsoup oPack to display HTML previews.</p>\n\n" + source("html", preview.data)
        }
      } else if ((type == "json" || type == "xml") && !showingSource) {
        const fromXML = type == "xml"
        var value
        try {
          if (fromXML) {
            const xml = preview.data.trim().replace(/^<\?xml\s[^?]*\?>/, "").trim()
            // Registry assets are untrusted. Skip DTD and entity declarations before parsing.
            if (!/<!\s*(?:DOCTYPE|ENTITY)\b/i.test(xml)) {
              const element = new XML(xml)
              if (element.nodeKind() == "element") {
                value = Object.fromEntries([[String(element.localName()), af.fromXML2Obj(element)]])
              }
            }
          } else {
            value = JSON.parse(preview.data)
          }
        } catch (e) {}
        if (isMap(value) || isArray(value)) {
          data += '<link rel="stylesheet" href="' + prefix + '/css/nJSMap.css"><script src="' + prefix + '/js/openafsigil.js"></script>' +
            '<script src="' + prefix + '/js/njsmap.js"></script>\n\n<div id="codeartifact-json" style="overflow:auto" data-format="' + type + '" data-json="' + escapeAsset(fromXML ? JSON.stringify(value) : preview.data) + '">' +
            source(type, preview.data) + '</div>\n\n<script>document.addEventListener("DOMContentLoaded",function(){var view=document.getElementById("codeartifact-json");' +
            'if(!window.nJSMap)return; var esc=function(s){return String(s).replace(/[&<>"\x27]/g,function(c){return "&#"+c.charCodeAt(0)+";";});};' +
            'var safe=function(v){if(Array.isArray(v))return v.map(safe);if(v&&typeof v==="object")return Object.fromEntries(Object.entries(v).map(function(x){return [esc(x[0]),safe(x[1])];}));return v==null?"null":typeof v==="string"?view.dataset.format==="xml"?"<span>"+esc(v)+"</span>":esc(v):v;};' +
            'try{var value=safe(JSON.parse(view.dataset.json)),previous;function render(){var dark=document.body.classList.contains("markdown-body-dark");if(previous===dark)return;previous=dark;view.classList.toggle("njsmap_dark",dark);var result=nJSMap(value,undefined,dark);if(result)view.innerHTML=result;}render();new MutationObserver(render).observe(document.body,{attributeFilter:["class"]});}catch(e){} });</script>\n\n'
        } else {
          if (isUnDef(value)) data += "<p>This asset could not be parsed as " + type.toUpperCase() + ".</p>\n\n"
          data += source(type, preview.data)
        }
      } else {
        data += source(type, preview.data)
      }
      return { data: data, type: "raw", browseDetail: true, truncated: !!preview.truncated }
    }

    args.fns = {
      validate: (request, options) => {
        var path = global.__ojobHttpRelativePath(request.uri, options.parentURI)
        if (/(^|\/)\.\.(\/|$)/.test(path) || /[\\\x00]/.test(path)) { var denied = new Error("Forbidden"); denied.httpStatus = 403; throw denied }
        var patterns = isString(args.restrict) ? [args.restrict] : (args.restrict || [])
        var prefixes=path.split("/").map((part,i,all)=>all.slice(0,i+1).join("/"))
        if (patterns.some(p => prefixes.some(prefix => new RegExp(p).test(prefix)))) { var denied = new Error("Forbidden"); denied.httpStatus = 403; throw denied }
      },
      init   : () => {
        browseCache("codeartifact-domains")
        .ttl(args.cache)
        .fn(() => {
          var _aws = getAWS()
          var lst = _aws.CODEARTIFACT_ListDomains(args.region)
          if (isDef(args.domain)) lst = lst.filter(f => (f.domainName || f.name) == args.domain)
          return lst
        })
        .create()

        browseCache("codeartifact-repos")
        .ttl(args.cache)
        .fn(k => {
          var _aws = getAWS()
          var lst = _aws.CODEARTIFACT_ListRepositories(args.region, args.repository)
          return lst
        })
        .create()

        // Packages and indexes are loaded and replaced as one repository snapshot.
        browseCache("codeartifact-package-tree")
        .ttl(args.cache)
        .fn(k => {
          var id = stringify(k, __, "")
          var state = provider && syncFn(() => treeState[id], treeLock)
          var lst = getAWS().CODEARTIFACT_ListPackages(args.region, k.repository, k.domain, args.format, args.namespace,
            state && (page => {
              var paths = page.filter(pkg => !isDef(args.namespace) || pkg.namespace == args.namespace).map(packagePath)
              syncFn(() => {
                if (treeState[id] === state && state.refreshing) state.pages.push(paths)
              }, treeLock)
            }))
          if (!isArray(lst)) throw new Error("Invalid CodeArtifact package response")
          if (isDef(args.namespace)) lst = lst.filter(f => f.namespace == args.namespace)
          return buildPackageTree(lst)
        })
        .create()

        browseCache("codeartifact-versions")
        .ttl(args.cache)
        .fn(k => {
          var _aws = getAWS()
          return _aws.CODEARTIFACT_ListPackageVersions(args.region, k.repository, k.domain, k.format, k.namespace, k.package)
        })
        .create()

        browseCache("codeartifact-assets")
        .ttl(args.cache)
        .fn(k => {
          var _aws = getAWS()
          return _aws.CODEARTIFACT_ListPackageVersionAssets(args.region, k.repository, k.domain, k.format, k.namespace, k.package, k.version)
        })
        .create()

        // Warm the root cache at startup. A failed load can be retried on the first request.
        if (args.browse !== false) {
          try {
            browseCache("codeartifact-domains").get({})
          } catch (e) {
            logWarn("Could not warm the browse root cache")
          }
        }

        if (isDef(args.initialize)) {
          $doV(() => {
            var _inits = af.fromJSSLON(args.initialize)
            pForEach(_inits, i => {
              readTree({
                domain    : i.domain,
                repository: i.repository
              })
            })
          })
        }
      },
      getList: (request, options) => {
        args.fns.validate(request, options)
        const uri = request.uri
        var puri = global.__ojobHttpRelativePath(uri, options.parentURI).replace(/\/+$/, "")
        var parts = puri.split("/").filter(r => r.length > 0)
        var reqParams = isMap(request.params) ? request.params : {}
        var reqPage = isDef(reqParams.page) ? Number(reqParams.page) : __
        var reqPageSize = __

        if (parts.length == 0) {
          var domains = browseCache("codeartifact-domains").get({})
          var paged = applyPaging($from(domains).sort("domainName").select(d => {
            return {
              isDirectory: true,
              values     : {
                "Domain" : d.domainName || d.name,
                "Owner"  : d.owner || "",
                "Created": isDef(d.createdTime) ? new Date(d.createdTime * 1000).toISOString().replace(/T/, " ").replace(/\..+/, "") : ""
              }
            }
          }), reqPage, reqPageSize)
          return withPagingInfo({
            isList: true,
            fields: [ "Domain", "Owner", "Created" ],
            alignFields: [ "left", "left", "left" ],
            key   : [ "Domain" ],
            list  : paged.list
          }, paged)
        }

        if (parts.length == 1) {
          var domain = parts[0]
          var repos = browseCache("codeartifact-repos").get({}).filter(r => r.domainName == domain)
          var paged = applyPaging($from(repos).sort("repositoryName").select(r => {
            return {
              isDirectory: true,
              values     : {
                "Repository" : r.repositoryName || r.name,
                "Domain"     : r.domainName || "",
                "Owner"      : r.owner || "",
                "Description": r.description || ""
              }
            }
          }), reqPage, reqPageSize)
          return withPagingInfo({
            isList: true,
            fields: [ "Repository", "Domain", "Owner", "Description" ],
            alignFields: [ "left", "left", "left", "left" ],
            key   : [ "Repository" ],
            content: prefetchEnabled && !options._api &&
              options.capabilities && options.capabilities.prefetch === 1 ? repositoryPrefetch : __,
            list  : paged.list
          }, paged)
        }

        var domain = parts[0]
        var repo = parts[1]
        var remaining = parts.slice(2).join("/")

        var tree = readTree({ domain: domain, repository: repo }, !options._api)
        var lstParent = tree.parents
        var childrenMap = tree.childrenMap || {}
        var leafByPath = tree.leafByPath || {}

        if (remaining.length == 0) {
          var rootChildren = childrenMap[""] || $from(lstParent).equals("level", 1).select(r => r.name).sort()
          var paged = applyPaging($from(rootChildren).select(name => {
            var f = tree.parentsMap[name + "|1"]
            return {
              isDirectory: f.isParent,
              values     : {
                "Package"  : f.name,
                "Format"   : f.pkg.format || "",
                "Namespace": f.pkg.namespace || ""
              }
            }
          }), reqPage, reqPageSize)
          return withPagingInfo({
            isList: true,
            fields: [ "Package", "Format", "Namespace" ],
            alignFields: [ "left", "left", "left" ],
