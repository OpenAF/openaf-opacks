include:
- oJobHTTPd.yaml
- oJobBrowse.yaml

#ojob:
#  catch: $err(exception, __, __, job.exec)
#  daemon: true
#  logToConsole: true

jobs:
# ---------------------------------
- name : HTTP Browse - codeartifact
  to   : HTTP Browse generic
  typeArgs:
    noLog   : false
    shortcut: &httpBrowseCodeArtifactTypeArgs
      name  : CodeArtifactBrowse
      keyArg: port
      args  :
        accessKey : accessKey
        secret    : secret
        token     : token
        region    : region
        assumeRole: assumeRole
        uri       : uri
        path      : path
        browse    : browse
        logo      : logo
        incURI    : incURI
        cache     : cache
        sortTab   : sortTab
        options   : options
        operationsBrowseUris: operationsBrowseUris
        domain    : domain
        repository: repository
        format    : format
        namespace : namespace
        initialize: initialize
        download  : download
  exec : &httpBrowseCodeArtifactExec | #js
    var support, provider, enhanced = args.options && (args.options.query && args.options.query.enabled || args.options.preview || args.options.operations && args.options.operations.enabled)
    if (enhanced) {
      try { support = require("ojob-browse-contract.js") } catch(e) { throw new Error("Enhanced browsing requires updated oJob-common (browse contract 1)") }
      support.check(args.options, support.capabilities)
      provider = support.provider(args.options)
    }
    var cacheNamespace = "browse-" + genUUID() + "-"
    var browseCache = name => provider ? provider.cache(name) : $cache(cacheNamespace + name)

    args.options = merge(args.options, {
      showURI : args.incURI,
      sortTab : args.sortTab,
      logo    : args.logo,
      browse  : args.browse,
      default : args.default,
      download: args.download
    })

    loadLib("aws.js")
    var aws, clientLock = new java.lang.Object()
    var getAWS = () => syncFn(() => {
      var expiry = aws && (isDef(aws.assumeRoleExp) ? aws.assumeRoleExp : Date.parse(String(aws._credentialExpiration)))
      if (!aws || isFinite(expiry) && expiry <= now() + 60000) {
        var next = new AWS(args.accessKey, args.secret, args.token, args.region)
        if (isDef(args.assumeRole)) next = next.assumeRole(args.assumeRole)
        aws = next
      }
      return aws
    }, clientLock)

    var buildPackageTree = aPackages => {
      var _packages = (aPackages || []).map(p => {
        var parts = [ p.format ]
        if (isDef(p.namespace) && p.namespace.length > 0) parts.push(p.namespace)
        parts.push(p.package)
        return merge({ path: parts.join("/") }, p)
      })

      var _parents = []
      var _parentsMap = Object.create(null)
      var _childrenMap = Object.create(null)
      var _leafByPath = Object.create(null)

      for(var i = 0; i < _packages.length; i++) {
        var r = _packages[i]
        var parts = r.path.split("/")
        for(var j = 0; j < parts.length; j++) {
          var parent = parts.slice(0, j + 1).join("/")
          var key = parent + "|" + (j + 1)
          if (!isDef(_parentsMap[key])) {
            var entry = { name: parent, isParent: parent != r.path, level: j + 1, pkg: r }
            _parentsMap[key] = entry
            _parents.push(entry)
            var prefix = parts.slice(0, j).join("/")
            if (!isDef(_childrenMap[prefix])) _childrenMap[prefix] = []
            _childrenMap[prefix].push(parent)
          } else if (parent == r.path) {
            _parentsMap[key].isParent = false
            _parentsMap[key].pkg = r
          }
        }
        _leafByPath[r.path] = r
      }

      Object.keys(_childrenMap).forEach(k => _childrenMap[k].sort())

      return { list: _packages, parents: _parents, parentsMap: _parentsMap, childrenMap: _childrenMap, leafByPath: _leafByPath }
    }

    // Enhanced browsing retains the provider's expired tree while one refresh runs.
    // Only refresh coordination is stored here; snapshots remain bounded by the provider.
    var treeState = Object.create(null), treeLock = new java.lang.Object()
    var treeSlots = new java.util.concurrent.Semaphore(3)
    var treeTTL = isNumber(args.cache) ? args.cache : 5000
    var readTree = key => {
      if (!provider) return browseCache("codeartifact-package-tree").get(key)
      var id = stringify(key, __, "")
      var unit = provider.entries("codeartifact-package-tree").filter(u => u.key.domain == key.domain && u.key.repository == key.repository)[0]
      var load = () => {
        treeSlots.acquire()
        try { return browseCache("codeartifact-package-tree").get(key) }
        finally { treeSlots.release() }
      }
      if (!unit) return load()
      if (now() < unit.expiresAt) return unit.value
      var state = syncFn(() => {
        // Remove expired backoff records so failed repositories cannot grow this map forever.
        Object.keys(treeState).forEach(k => {
          if (!treeState[k].refreshing && now() >= treeState[k].retryAt) delete treeState[k]
        })
        if (treeState[id] || Object.keys(treeState).length >= 1000) return __
        var next = { key: key, refreshing: true }
        treeState[id] = next
        return next
      }, treeLock)
      if (state) {
        var failed = e => {
          syncFn(() => {
            if (treeState[id] === state) {
              state.refreshing = false
              state.retryAt = now() + Math.max(1000, treeTTL)
            }
          }, treeLock)
          logWarn("Error refreshing CodeArtifact packages: " + e)
        }
        try {
          $doV(() => {
            treeSlots.acquire()
            try {
              // Explicit refresh cancels queued work before invalidating snapshots.
              if (!syncFn(() => treeState[id] === state, treeLock)) return
              browseCache("codeartifact-package-tree").get(key)
              syncFn(() => { if (treeState[id] === state) delete treeState[id] }, treeLock)
            } catch(e) { failed(e) }
            finally { treeSlots.release() }
          })
        } catch(e) { failed(e) }
      }
      return unit.value
    }

    var getPaging = (page, pageSize) => {
      var _pageSize = isDef(pageSize) ? Number(pageSize) : Number(isDef(args.pageSize) ? args.pageSize : (args.options || {}).pageSize)
      if (isNaN(_pageSize) || _pageSize <= 0) _pageSize = 0
      var _page = isDef(page) ? Number(page) : Number(isDef(args.page) ? args.page : (args.options || {}).page)
      if (isNaN(_page) || _page <= 0) _page = 1
      return { pageSize: _pageSize, page: _page }
    }

    var applyPaging = (aList, page, pageSize) => {
      var p = enhanced && args.options.query && args.options.query.enabled ? {page:1,pageSize:0} : getPaging(page, pageSize)
      var _list = isArray(aList) ? aList : []
      var total = _list.length

      if (p.pageSize <= 0) {
        return {
          list       : _list,
          total      : total,
          page       : 1,
          pageSize   : 0,
          totalPages : 1,
          hasPrevious: false,
          hasNext    : false
        }
      }

      var totalPages = Math.max(1, Math.ceil(total / p.pageSize))
      var currentPage = Math.min(Math.max(1, p.page), totalPages)
      var start = (currentPage - 1) * p.pageSize

      return {
        list       : _list.slice(start, start + p.pageSize),
        total      : total,
        page       : currentPage,
        pageSize   : p.pageSize,
        totalPages : totalPages,
        hasPrevious: currentPage > 1,
        hasNext    : currentPage < totalPages
      }
    }

    var withPagingInfo = (lst, pageInfo) => merge({
      pageInfo: {
        total      : pageInfo.total,
        page       : pageInfo.page,
        pageSize   : pageInfo.pageSize,
        totalPages : pageInfo.totalPages,
        hasPrevious: pageInfo.hasPrevious,
        hasNext    : pageInfo.hasNext
      }
    }, lst)

    // Paging options: pageSize/page can be passed as args or via args.options
    args.fns = {
      validate: (request, options) => {
        var path = global.__ojobHttpRelativePath(request.uri, options.parentURI)
        if (/(^|\/)\.\.(\/|$)/.test(path) || /[\\\x00]/.test(path)) { var denied = new Error("Forbidden"); denied.httpStatus = 403; throw denied }
        var patterns = isString(args.restrict) ? [args.restrict] : (args.restrict || [])
        var prefixes=path.split("/").map((part,i,all)=>all.slice(0,i+1).join("/"))
        if (patterns.some(p => prefixes.some(prefix => new RegExp(p).test(prefix)))) { var denied = new Error("Forbidden"); denied.httpStatus = 403; throw denied }
      },
      init   : () => {
        browseCache("codeartifact-domains")
        .ttl(args.cache)
        .fn(() => {
          var _aws = getAWS()
          var lst = _aws.CODEARTIFACT_ListDomains(args.region)
          if (isDef(args.domain)) lst = lst.filter(f => (f.domainName || f.name) == args.domain)
          return lst
        })
        .create()

        browseCache("codeartifact-repos")
        .ttl(args.cache)
        .fn(k => {
          var _aws = getAWS()
          var lst = _aws.CODEARTIFACT_ListRepositories(args.region, args.repository)
          return lst
        })
        .create()

        // Packages and indexes are loaded and replaced as one repository snapshot.
        browseCache("codeartifact-package-tree")
        .ttl(args.cache)
        .fn(k => {
          var lst = getAWS().CODEARTIFACT_ListPackages(args.region, k.repository, k.domain, args.format, args.namespace)
          if (!isArray(lst)) throw new Error("Invalid CodeArtifact package response")
          if (isDef(args.namespace)) lst = lst.filter(f => f.namespace == args.namespace)
          return buildPackageTree(lst)
        })
        .create()

        browseCache("codeartifact-versions")
        .ttl(args.cache)
        .fn(k => {
          var _aws = getAWS()
          return _aws.CODEARTIFACT_ListPackageVersions(args.region, k.repository, k.domain, k.format, k.namespace, k.package)
        })
        .create()

        browseCache("codeartifact-assets")
        .ttl(args.cache)
        .fn(k => {
          var _aws = getAWS()
          return _aws.CODEARTIFACT_ListPackageVersionAssets(args.region, k.repository, k.domain, k.format, k.namespace, k.package, k.version)
        })
        .create()

        if (isDef(args.initialize)) {
          $doV(() => {
            var _inits = af.fromJSSLON(args.initialize)
            pForEach(_inits, i => {
              readTree({
                domain    : i.domain,
                repository: i.repository
              })
            })
          })
        }
      },
      getList: (request, options) => {
        args.fns.validate(request, options)
        const uri = request.uri
        var puri = global.__ojobHttpRelativePath(uri, options.parentURI).replace(/\/+$/, "")
        var parts = puri.split("/").filter(r => r.length > 0)
        var reqParams = isMap(request.params) ? request.params : {}
        var reqPage = isDef(reqParams.page) ? Number(reqParams.page) : __
        var reqPageSize = __

        if (parts.length == 0) {
          var domains = browseCache("codeartifact-domains").get({})
          var paged = applyPaging($from(domains).sort("domainName").select(d => {
            return {
              isDirectory: true,
              values     : {
                "Domain" : d.domainName || d.name,
                "Owner"  : d.owner || "",
                "Created": isDef(d.createdTime) ? new Date(d.createdTime * 1000).toISOString().replace(/T/, " ").replace(/\..+/, "") : ""
              }
            }
          }), reqPage, reqPageSize)
          return withPagingInfo({
            isList: true,
            fields: [ "Domain", "Owner", "Created" ],
            alignFields: [ "left", "left", "left" ],
            key   : [ "Domain" ],
            list  : paged.list
          }, paged)
        }

        if (parts.length == 1) {
          var domain = parts[0]
          var repos = browseCache("codeartifact-repos").get({}).filter(r => r.domainName == domain)
          var paged = applyPaging($from(repos).sort("repositoryName").select(r => {
            return {
              isDirectory: true,
              values     : {
                "Repository" : r.repositoryName || r.name,
                "Domain"     : r.domainName || "",
                "Owner"      : r.owner || "",
                "Description": r.description || ""
              }
            }
          }), reqPage, reqPageSize)
          return withPagingInfo({
            isList: true,
            fields: [ "Repository", "Domain", "Owner", "Description" ],
            alignFields: [ "left", "left", "left", "left" ],
            key   : [ "Repository" ],
            list  : paged.list
          }, paged)
        }

        var domain = parts[0]
        var repo = parts[1]
        var remaining = parts.slice(2).join("/")

        var tree = readTree({ domain: domain, repository: repo })
        var lstParent = tree.parents
        var childrenMap = tree.childrenMap || {}
        var leafByPath = tree.leafByPath || {}

        if (remaining.length == 0) {
          var rootChildren = childrenMap[""] || $from(lstParent).equals("level", 1).select(r => r.name).sort()
          var paged = applyPaging($from(rootChildren).select(name => {
            var f = tree.parentsMap[name + "|1"]
            return {
              isDirectory: f.isParent,
              values     : {
                "Package"  : f.name,
                "Format"   : f.pkg.format || "",
                "Namespace": f.pkg.namespace || ""
              }
            }
          }), reqPage, reqPageSize)
          return withPagingInfo({
            isList: true,
            fields: [ "Package", "Format", "Namespace" ],
            alignFields: [ "left", "left", "left" ],
            key   : [ "Package" ],
            list  : paged.list
          }, paged)
        }

        var level = remaining.split("/").filter(r => r.length > 0).length

        if (remaining.length > 0) {
          var remParts = remaining.split("/").filter(r => r.length > 0)
          if (remParts.length > 1) {
            var ver = remParts[remParts.length - 1]
            var pkgPath = remParts.slice(0, -1).join("/")
            var leafPkg = leafByPath[pkgPath]
            if (isDef(leafPkg)) {
              var versions = browseCache("codeartifact-versions").get({
                domain    : domain,
                repository: repo,
                format    : leafPkg.format,
                namespace : leafPkg.namespace,
                package   : leafPkg.package
              })

              if ($from(versions).equals("version", ver).any()) {
                return { isFile: true }
              }
            }
          }

          if (!isDef(childrenMap[remaining]) && !isDef(leafByPath[remaining])) {
            return { isFile: false }
          }
        }

        var leaf = leafByPath[remaining]
        if (isDef(leaf)) {
          var versions = browseCache("codeartifact-versions").get({
            domain    : domain,
            repository: repo,
            format    : leaf.format,
            namespace : leaf.namespace,
            package   : leaf.package
          })

          var _paged = applyPaging($from(versions).sort("-publishedTime").select(v => {
            return {
              isDirectory: false,
              values     : {
                "Version"  : v.version || "",
                "Status"   : v.status || "",
                "Published": isDef(v.publishedTime) ? new Date(v.publishedTime*1000).toISOString().replace(/T/, " ").replace(/\..+/, "") : ""
              }
            }
          }), reqPage, reqPageSize)
          return withPagingInfo({
            isList: true,
            fields: [ "Version", "Status", "Published" ],
            alignFields: [ "left", "left", "left" ],
            key   : [ "Version" ],
            list  : _paged.list
          }, _paged)
        }

        var listPrefix = remaining
        var listNames = childrenMap[listPrefix] || []
        var paged = applyPaging($from(listNames).select(name => {
          var f = tree.parentsMap[name + "|" + (level + 1)]
          return {
            isDirectory: f.isParent,
            values     : {
              "Package"  : f.name.substring(remaining.length + 1),
              "Format"   : f.pkg.format || "",
              "Namespace": f.pkg.namespace || ""
            }
          }
        }), reqPage, reqPageSize)
        return withPagingInfo({
          isList: true,
          fields: [ "Package", "Format", "Namespace" ],
          alignFields: [ "left", "left", "left" ],
          key   : [ "Package" ],
          list  : paged.list
        }, paged)
      },
      getObj: (request, options) => {
        args.fns.validate(request, options)
        const uri = request.uri
        var puri = global.__ojobHttpRelativePath(uri, options.parentURI).replace(/\/+$/, "")
        var parts = puri.split("/").filter(r => r.length > 0)

        var domain = parts[0]
        var repo = parts[1]
        var version = parts[parts.length - 1]
        var pkgParts = parts.slice(2, -1)
        var format = pkgParts[0]
        var pkg = pkgParts[pkgParts.length - 1]
        var namespace = pkgParts.length > 2 ? pkgParts.slice(1, -1).join("/") : __

        if (support && options.preview && !options._api && request.params && request.params.asset && request.params.raw != "true") {
          var name = String(request.params.asset), previewType = support.format(name,options.preview,support.defaults)
          if (previewType) {
            var previewAsset = getAWS().CODEARTIFACT_GetPackageVersionAsset(args.region,repo,domain,format,namespace,pkg,version,name)
            return support.readPreview(previewAsset.stream,previewType,options.preview.maxBytes)
          }
        }
        if (options.download && isDef(request.params) && isDef(request.params.asset)) {
          try {
            var _aws = getAWS()
            var result = _aws.CODEARTIFACT_GetPackageVersionAsset(args.region, repo, domain, format, namespace, pkg, version, request.params.asset)
            return { stream: result.stream }
          } catch(e) {
            logErr("CodeArtifact download error [" + request.params.asset + "]: " + String(e))
            throw e
          }
        }

        var assets = browseCache("codeartifact-assets").get({
          domain    : domain,
          repository: repo,
          format    : format,
          namespace : namespace,
          package   : pkg,
          version   : version
        })
        traverse(assets, (aK, aV, aP, aO) => {
          if (aK == "SHA-512") {
            delete aO[aK]
          }
        })

        if (options._api) return { data: assets, type: "json" }

        var data = "\n"
        data += `## 📦 Package version assets\n\n`
        data += `🏷️ **Domain:** \`${domain}\`  \n`
        data += `📦 **Repository:** \`${repo}\`  \n`
        data += `📄 **Package:** \`${pkg}\`  \n`
        data += `🧩 **Format:** \`${format}\`  \n`
        data += `🧭 **Namespace:** ${isDef(namespace) ? "`" + namespace + "`" : ""}  \n`
        data += `🔖 **Version:** \`${version}\`\n\n---\n`

        data += "| Asset | Size | Hashes |\n"
        data += "|:---|---:|---|\n"
        $from(assets).sort("assetName").select(a => {
          var assetName = a.name || a.assetName || ""
          var dlLink = (options.download && assetName.length > 0)
            ? `<a href="?asset=${encodeURIComponent(assetName)}" download="${assetName}">⬇</a> `
            : ""
          var assetDisplay = (options.download && assetName.length > 0)
            ? `<a href="?asset=${encodeURIComponent(assetName)}" download="${assetName}">${assetName}</a>`
            : assetName
          data += `| ${dlLink}${assetDisplay} | ${isDef(a.size) ? ow.format.toBytesAbbreviation(a.size) : ""} | ${af.toYAML(a.hashes).replace(/\n/g, "</br>") || ""} |\n`
        })

        if (options.sortTab) data += "<script src=\"/js/mdtablesort.js\"></script>\n"

        return {
          data: data,
          type: "raw"
        }
      }
    }


    if (provider) {
      args.fns.search = (request,options) => {
        args.fns.validate(request, options)
        if (!options.query || !options.query.enabled) support.error(501,"Enhanced search is not enabled")
        var path=global.__ojobHttpRelativePath(request.uri,options.parentURI).replace(/\/+$/, ""),q=String((request.params||{}).q||""),rows=[]
        if(q.length>(options.query.maxQueryLength||256))support.error(400,"Query too long")
        provider.entries("codeartifact-package-tree").forEach(unit=>{
          var prefix=unit.key.domain+"/"+unit.key.repository+"/"
          unit.value.list.forEach(pkg=>{var name=prefix+pkg.path;if((!path||name.startsWith(path+"/"))&&name.toLowerCase().indexOf(q.toLowerCase())>=0)rows.push({isDirectory:true,values:{Package:path?name.substring(path.length+1):name}})})
        })
        var max=options.query.maxResults||1000
        return {isList:true,fields:["Package"],alignFields:["left"],key:"Package",list:rows.slice(0,max),searchInfo:{complete:false,truncated:rows.length>max,totalExact:false,scanned:rows.length,coverage:"loaded package hierarchies"}}
      }
      // The browser carries its sort field when entering or clearing search.
      // Reset known columns from another view before the shared query validator runs.
      var sortFields = ["Domain", "Owner", "Created", "Repository", "Description", "Package", "Format", "Namespace", "Version", "Status", "Published"]
      ;["getList", "search"].forEach(name => {
        var original = args.fns[name]
        args.fns[name] = (request, options) => {
          var result = original(request, options)
          var params = request.params || {}
          if (result.isList && options.query && options.query.enabled && sortFields.indexOf(params.sort) >= 0 && result.fields.indexOf(params.sort) < 0) {
            params.sort = String(result.key)
          }
          return result
        }
      })
      args.fns.getStatus = () => merge(provider.status(), {
        refreshing: syncFn(() => Object.keys(treeState).filter(k => treeState[k].refreshing).length, treeLock)
      })
      args.fns.getFreshness = (request,options) => {
        var path = global.__ojobHttpRelativePath(request.uri,options.parentURI)
        var freshness = provider.freshness((name,key) => support.matchesUnit(path,key,options.parentPath))
        freshness.refreshing = syncFn(() => Object.keys(treeState).some(k => treeState[k].refreshing && support.matchesUnit(path,treeState[k].key,options.parentPath)), treeLock)
        return freshness
      }
      args.fns.refresh = (request, options) => {
        var path = global.__ojobHttpRelativePath(request.uri, options.parentURI).replace(/\/+$/, "")
        // Drain active loads; queued callbacks check their identity before loading.
        treeSlots.acquire(3)
        try {
          syncFn(() => {
            Object.keys(treeState).forEach(k => {
              if (support.matchesUnit(path,treeState[k].key,options.parentPath)) delete treeState[k]
            })
            provider.invalidate((name,key) => support.matchesUnit(path,key,options.parentPath))
          }, treeLock)
        } finally { treeSlots.release(3) }
        args.fns.getList(request, options)
      }
    }

# ------------------------------------------
- name    : HTTP Browse - codeartifact - API
  to      : HTTP Browse API
  typeArgs:
    noLog   : false
    shortcut:
      <<    : *httpBrowseCodeArtifactTypeArgs
      name  : CodeArtifactBrowseAPI
  exec: | #js
    if (args.options && (args.options.query && args.options.query.enabled || args.options.preview || args.options.operations && args.options.operations.enabled)) {
      var support
      try { support = require("ojob-browse-contract.js") } catch(e) { throw new Error("Enhanced browsing requires updated oJob-common (browse contract 1)") }
      support.check(args.options, support.capabilities)
    }


