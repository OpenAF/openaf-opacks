include:
- oJobTest.yaml

ojob:
  catch : printErrnl("[" + job.name + "] "); if (isDef(exception.javaException)) exception.javaException.printStackTrace(); else printErr(exception)
  opacks:
  - oJob-common

todo:
- Parquet::WriteReadRoundTrip
- Parquet::InferredTypesAreNative
- Parquet::DateFieldsBecomeISOStrings
- Parquet::MissingFieldsReadAsNull
- Parquet::ExplicitSchemaOverride
- Parquet::ForEachVisitsEveryRow
- Parquet::FieldMapperSkipsField
- Parquet::FieldMapperRenamesField
- Parquet::GetSchema
- Parquet::GetMeta
- Parquet::GetStats
