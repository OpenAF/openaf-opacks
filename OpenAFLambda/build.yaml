help:
  text: Build standalone OpenAF Lambda ZIPs using Docker Buildx
  expects:
  - name: target
    desc: function (default) or microvm (arm64)
  - name: arch
    desc: both (default), x86_64 or arm64
  - name: output
    desc: Output directory (default output)
  - name: java
    desc: Java major version (default 25)
  - name: jreProvider
    desc: temurin (default) or corretto
  - name: dist
    desc: OpenAF distribution (default stable)
  - name: cds
    desc: JVM class sharing mode, auto (default) or off
  - name: opacks
    desc: Comma-separated opacks (default AWS,oJob-common)
  - name: jar
    desc: Optional local repacked OpenAF JAR
  - name: workload
    desc: Optional workload directory
  - name: localOpacks
    desc: JSON array of local opack paths

ojob: {}

todo:
- Build Lambda ZIPs

jobs:
- name: Build Lambda ZIPs
  exec: |
    global.lambdaSource = getOPackPath("OpenAFLambda") || io.fileInfo("build.yaml").canonicalPath.replace(/[/\\]build.yaml$/, "");
    global.lambdaImport = true;
    require(global.lambdaSource + "/scripts/build.js").build(args);
