help:
  text: Build standalone OpenAF Lambda ZIPs using Docker Buildx
  expects:
  - name: target
    desc: function (default) or microvm (arm64)
  - name: arch
    desc: both (default), x86_64 or arm64
  - name: output
    desc: Output directory (default output)
  - name: java
    desc: Java major version (default 25)
  - name: jreProvider
    desc: temurin (default) or corretto
  - name: dist
    desc: OpenAF distribution (default stable)
  - name: cds
    desc: JVM class sharing mode, auto (default) or off
  - name: opacks
    desc: Comma-separated opacks (default AWS,oJob-common)
  - name: jar
    desc: Optional local repacked OpenAF JAR
  - name: workload
    desc: Optional workload directory
  - name: localOpacks
    desc: JSON array of local opack paths

ojob: {}

todo:
- Build Lambda ZIPs

jobs:
- name: Build Lambda ZIPs
  exec: |
    var command = ["python3", getOPackPath("OpenAFLambda") + "/scripts/build.py"];
    if (isUnDef(getOPackPath("OpenAFLambda"))) command[1] = "scripts/build.py";
    ["target", "arch", "output", "java", "dist", "cds", "opacks", "workload"].forEach(function(key) {
      if (isDef(args[key])) command.push("--" + key, String(args[key]));
    });
    if (isDef(args.jar)) command.push("--openaf-jar", String(args.jar));
    if (isDef(args.jreProvider)) command.push("--jre-provider", String(args.jreProvider));
    if (isDef(args.localOpacks)) {
      var local = isArray(args.localOpacks) ? args.localOpacks : jsonParse(args.localOpacks);
      local.forEach(function(file) { command.push("--opack", String(file)); });
    }
    var list = new java.util.ArrayList();
    command.forEach(function(value) { list.add(String(value)); });
    var process = new java.lang.ProcessBuilder(list).inheritIO().start();
    if (process.waitFor() != 0) throw "Lambda build failed.";
