- name: Test results
  from: oJob Test Results
  deps:
  - mdconvert::Html2mdHeading
  - mdconvert::Html2mdBoldAndItalic
  - mdconvert::Html2mdLink
  - mdconvert::Html2mdList
  - mdconvert::Html2mdRequiresString
  - mdconvert::Md2htmlBasic
  - mdconvert::Md2htmlInlineMarkup
  - mdconvert::Md2htmlTables
  - mdconvert::Md2htmlTablesDisabled
  - mdconvert::ParseAndRender
  - mdconvert::PdfBytesValid
  - mdconvert::PdfFileWrite
  - mdconvert::DocxBytesValid
  - mdconvert::DocxFileWrite
  - mdconvert::ShortcutHtml2md
  - mdconvert::ShortcutMd2html
  - mdconvert::ShortcutMd2pdf
  - mdconvert::ShortcutMd2docx
  - mdconvert::ShortcutMd2pdfFile
  - mdconvert::ShortcutMd2docxFile
  - mdconvert::EmptyStringHtml2md
  - mdconvert::EmptyStringMd2html
  - mdconvert::UnicodeContent
  args:
    quiet: true
  exec: |
    tprint("Tests PASSED : {{pass}}/{{count}}", args.results)
    tprint("Tests FAILED : {{fail}}/{{count}}", args.results)
    tprint("Tests ASSERTS: {{asserts}}", args.results)
    if (args.results.fail > 0) {
      printErr("There are failed tests")
      exit(-1)
    }
