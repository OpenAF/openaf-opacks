jobs:
- name: mdconvert::Init
  exec: |
    loadLib("mdconvert.js")
    args.tests = require("tests/autoTestMdConvert.js")

- name: mdconvert::Html2mdHeading
  from: mdconvert::Init
  to  : oJob Test
  exec: args.func = args.tests.testHtml2mdHeading

