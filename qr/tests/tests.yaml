include:
  - oJobTest.yaml

jobs:
  #-----------
  - name: Init
    exec: | 
      args.tests = require("tests/tests.js");

  #-----------------
  - name: TestStream
    from: Init
    to  : oJob Test
    exec: args.func = args.tests.testStream;

  #---------------
  - name: TestFile
    from: Init
    to  : oJob Test
    exec: args.func = args.tests.testFile;

  #--------------------
  - name: TestBitMatrix
    from: Init
    to  : oJob Test
    exec: args.func = args.tests.testBitMatrix;

  #----------------
  - name: TestASCII
    from: Init
    to  : oJob Test
    exec: args.func = args.tests.testASCII;

  #------------------
  - name: TestFormats
    from: Init
    to  : oJob Test
    exec: args.func = args.tests.testFormats;

